<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>商品库 · GlobalSDS 跨境货盘</title>
<link rel="stylesheet" href="_style.css">
</head>
<body>
<script>
(function(){try{if(!localStorage.getItem('sds_user')){location.replace('login.html');}}catch(e){}})();
</script>
<script src="mqtt.js"></script>
<script src="_data.js"></script>
<script src="_render.js"></script>
<script src="_shell.js"></script>
<script>renderShell({ title: '商品库' });</script>
<script type="text/template" id="tpl">

<div class="tools">
  <input class="inp" id="q" placeholder="搜索商品名称 / SKU" style="width:240px">
  <select class="inp" id="cat"><option>全部分类</option><option>数码配件</option><option>家居百货</option></select>
  <select class="inp" id="stockf"><option>全部库存</option><option>有货</option><option>缺货</option><option>预警</option></select>
  <button class="btn" onclick="doFilter()">查询</button>
  <button class="btn g" onclick="resetF()">重置</button>
  <div style="margin-left:auto;display:flex;gap:8px">
    <a class="btn" href="select.html">+ 导入商品</a>
    <button class="btn g" onclick="exportCSV()">导出 CSV</button>
  </div>
</div>

<div class="stats">
  <div class="st"><div class="k">商品总数</div><div class="v" id="k1">-</div></div>
  <div class="st"><div class="k">在售</div><div class="v" id="k2">-</div></div>
  <div class="st"><div class="k">缺货</div><div class="v" id="k3" style="color:#f53f3f">-</div></div>
  <div class="st"><div class="k">库存总量</div><div class="v" id="k4">-</div></div>
</div>

<div class="card">
  <div class="card-hd"><h2>商品列表</h2><div class="r"><span class="tag t-info" id="cnt">-</span></div></div>
  <div class="card-bd"><div class="goods" id="grid"></div></div>
</div>

</script>
<script>
document.getElementById('content').innerHTML = document.getElementById('tpl').innerHTML;

var ALL = [];
function draw(list){
  document.getElementById('grid').innerHTML = list.length
    ? list.map(SDSR.gdCard).join('')
    : '<div class="empty" style="grid-column:1/-1"><div class="e">📦</div>没有符合条件的商品</div>';
  document.getElementById('cnt').textContent = '共 ' + list.length + ' 条';
}
function doFilter(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var c = document.getElementById('cat').value;
  var sf = document.getElementById('stockf').value;
  var out = ALL.filter(function(p){
    if (q && (p.name||'').toLowerCase().indexOf(q)<0 && (p.sku||'').toLowerCase().indexOf(q)<0) return false;
    if (c!=='全部分类' && p.cat!==c) return false;
    if (sf==='有货' && p.stock<=0) return false;
    if (sf==='缺货' && p.stock>0) return false;
    if (sf==='预警' && !(p.stock>0 && p.stock<=p.moq*2)) return false;
    return true;
  });
  draw(out);
}
function resetF(){
  document.getElementById('q').value='';
  document.getElementById('cat').selectedIndex=0;
  document.getElementById('stockf').selectedIndex=0;
  draw(ALL);
}
function exportCSV(){
  var rows=[['SKU','名称','分类','供货价','零售价','库存','MOQ']];
  ALL.forEach(function(p){rows.push([p.sku,p.name,p.cat,p.price,p.retail,p.stock,p.moq])});
  var csv='\ufeff'+rows.map(function(r){return r.join(',')}).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='商品列表.csv'; a.click();
}
function boot(){
  ALL = SDS.products;
  var st = SDS.stats();
  document.getElementById('k1').textContent = st.products;
  document.getElementById('k2').textContent = st.onSale;
  document.getElementById('k3').textContent = st.outOfStock;
  document.getElementById('k4').textContent = st.stock.toLocaleString('zh-CN');
  draw(ALL);
}
SDS.onReady(boot);

</script>
</body>
</html>
