<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · GlobalSDS 跨境货盘系统</title>
<link rel="stylesheet" href="_style.css">
<style>
body{background:#f2f3f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lg{width:100%;max-width:920px;background:#fff;border-radius:8px;overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.08);display:flex;min-height:480px}
.lg-l{flex:1;background:linear-gradient(135deg,#0f70fd 0%,#409eff 55%,#764ba2 100%);
  padding:48px 44px;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.lg-l::after{content:"";position:absolute;right:-60px;bottom:-60px;width:240px;height:240px;
  background:rgba(255,255,255,.08);border-radius:50%}
.lg-l::before{content:"";position:absolute;left:-40px;top:-50px;width:180px;height:180px;
  background:rgba(255,255,255,.06);border-radius:50%}
.lg-logo{display:flex;align-items:center;gap:11px;margin-bottom:auto;position:relative;z-index:1}
.lg-logo .b{width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:19px;font-weight:700;backdrop-filter:blur(6px)}
.lg-logo b{font-size:17px;font-weight:600;letter-spacing:-.2px;display:block;line-height:1.2}
.lg-logo i{font-size:11px;opacity:.8;font-style:normal;display:block}
.lg-l h2{font-size:25px;font-weight:600;line-height:1.45;margin-bottom:12px;position:relative;z-index:1;letter-spacing:-.3px}
.lg-l p{font-size:13.5px;opacity:.85;line-height:1.8;position:relative;z-index:1}
.lg-l ul{list-style:none;margin-top:22px;position:relative;z-index:1}
.lg-l li{font-size:13px;opacity:.9;padding:5px 0;display:flex;align-items:center;gap:8px}
.lg-l li::before{content:"✓";width:16px;height:16px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:10px;flex:0 0 auto}

.lg-r{width:400px;flex:0 0 auto;padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.lg-r h3{font-size:21px;font-weight:600;margin-bottom:6px;letter-spacing:-.3px}
.lg-r .sub{font-size:13px;color:#86909c;margin-bottom:26px}
.fld{margin-bottom:17px}
.fld label{display:block;font-size:13px;color:#4e5969;margin-bottom:7px;font-weight:500}
.fld input{width:100%;height:40px;padding:0 13px;border:1px solid #e5e6eb;border-radius:4px;
  font-size:14px;outline:none;transition:.15s;background:#fff}
.fld input:hover{border-color:#c9cdd4}
.fld input:focus{border-color:#0f70fd;box-shadow:0 0 0 2px rgba(15,112,253,.1)}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:13px}
.row label{display:flex;align-items:center;gap:6px;color:#4e5969;cursor:pointer}
.row a{color:#0f70fd}
.btn-lg{width:100%;height:42px;border-radius:4px;background:#0f70fd;color:#fff;
  font-size:15px;font-weight:500;transition:.15s;border:0;cursor:pointer}
.btn-lg:hover{background:#0b5fd6}
.btn-lg:active{transform:scale(.99)}
.err{background:#ffece8;color:#f53f3f;font-size:13px;padding:9px 12px;border-radius:4px;
  margin-bottom:16px;display:none}
.err.on{display:block}
.demo{margin-top:20px;padding:12px 14px;background:#f7f8fa;border-radius:4px;
  font-size:12.5px;color:#86909c;line-height:1.8}
.demo b{color:#4e5969}
@media(max-width:860px){
  .lg{flex-direction:column;max-width:420px;min-height:auto}
  .lg-l{display:none}
  .lg-r{width:100%;padding:34px 26px}
}
</style>
</head>
<body>

<div class="lg">
  <div class="lg-l">
    <div class="lg-logo">
      <div class="b">G</div>
      <div><b>GlobalSDS</b><i>跨境货盘系统</i></div>
    </div>
    <h2>让跨境分销<br>像转发链接一样简单</h2>
    <p>货盘管理 · 分销授权 · 一键刊登 · 供应商分账</p>
    <ul>
      <li>多租户数据强制隔离</li>
      <li>两级分销价格体系</li>
      <li>阶梯价与 MOQ 起订</li>
      <li>操作审计全链路留痕</li>
    </ul>
  </div>

  <div class="lg-r">
    <h3>登录</h3>
    <div class="sub">请使用管理员分配的账号登录</div>

    <div class="err" id="err"></div>

    <form id="f" onsubmit="return doLogin(event)">
      <div class="fld">
        <label>账号</label>
        <input id="u" placeholder="请输入账号" autocomplete="username" value="admin">
      </div>
      <div class="fld">
        <label>密码</label>
        <input id="p" type="password" placeholder="请输入密码" autocomplete="current-password" value="admin123">
      </div>
      <div class="row">
        <label><input type="checkbox" checked style="width:14px;height:14px"> 记住登录</label>
        <a href="#">忘记密码？</a>
      </div>
      <button class="btn-lg" type="submit">登 录</button>
    </form>

    <div class="demo">
      演示账号：<b>admin</b> / <b>admin123</b><br>
      当前为静态演示版，点击登录直接进入工作台
    </div>
  </div>
</div>

<script>
function doLogin(e){
  e.preventDefault();
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  var err = document.getElementById('err');
  if(!u || !p){ err.textContent='请输入账号和密码'; err.classList.add('on'); return false; }
  if(u === 'admin' && p === 'admin123'){
    try{ localStorage.setItem('sds_user', u); }catch(x){}
    location.href = 'index.html';
  } else {
    err.textContent='账号或密码错误，演示账号：admin / admin123';
    err.classList.add('on');
  }
  return false;
}
</script>
</body>
</html>
