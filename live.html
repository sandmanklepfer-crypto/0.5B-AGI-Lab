<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>直播间 · 卤味小店</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .live-wrap{max-width:900px;margin:0 auto;padding:0 12px}
  .live-head{background:linear-gradient(160deg,#c0392b,#8e2418);color:#fff;padding:12px 0}
  .live-head .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .live-head h1{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge-live{display:inline-flex;align-items:center;gap:5px;background:#ff3b30;color:#fff;
    font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .badge-live .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}
  .badge-off{background:rgba(255,255,255,.22)}
  @keyframes bl{50%{opacity:.3}}

  .player{position:relative;background:#000;border-radius:14px;overflow:hidden;
    margin-top:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .player video{width:100%;height:100%;display:block;background:#000}
  .player iframe{width:100%;height:100%;border:0}
  .player .ph{color:#c9b8ae;text-align:center;padding:20px;font-size:13.5px;line-height:1.9}
  .player .ph .ic{font-size:40px;display:block;margin-bottom:8px;opacity:.7}
  .player .cover{position:absolute;inset:0;object-fit:cover;width:100%;height:100%}

  .notice{margin-top:10px;background:#fff8e6;border:1px solid #f0d9a0;color:#8a6100;
    border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.75}

  .sec{display:flex;align-items:center;gap:8px;margin:18px 0 9px;font-weight:700;font-size:15px}
  .sec::before{content:"";width:3px;height:15px;background:var(--brand);border-radius:2px}

  .chat-box{background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .chat-list{height:260px;overflow-y:auto;padding:10px 12px;font-size:13.5px;line-height:1.9}
  .chat-list .m{margin-bottom:7px;word-break:break-word}
  .chat-list .m b{color:var(--brand)}
  .chat-list .m .t{color:var(--muted);font-weight:400;font-size:11px;margin-left:5px}
  .chat-list .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}
  .chat-in{display:flex;gap:8px;padding:9px;border-top:1px solid var(--line);background:#fdfaf7}
  .chat-in input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    font-size:14px;outline:none;background:#fff}
  .chat-in input:focus{border-color:var(--brand)}
  .chat-in button{flex:0 0 auto;padding:10px 18px;border-radius:12px;background:var(--brand);
    color:#fff;font-weight:700;font-size:14px}
  .chat-in button:disabled{opacity:.5}
  .chat-off{padding:16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header class="live-head">
  <div class="live-wrap">
    <div class="row">
      <span class="badge-live badge-off" id="liveBadge"><span class="dot"></span><span id="liveText">未开播</span></span>
      <h1 id="liveTitle">直播间</h1>
      <a class="mini" href="./" style="text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:20px;padding:5px 13px;font-size:12.5px">🛒 去下单</a>
      <a class="mini" href="ledger.html" id="linkLedger" style="display:none"></a>
    </div>
    <div style="font-size:12.5px;opacity:.85;margin-top:6px">
      <span id="viewers">0</span> 人在看
    </div>
  </div>
</header>

<div class="live-wrap">
  <div class="player" id="player">
    <div class="ph"><span class="ic">📺</span>正在连接直播…</div>
  </div>

  <div class="notice" id="liveNotice" style="display:none"></div>

  <div class="sec">直播好物</div>
  <div id="goods"></div>

  <div class="sec">聊两句</div>
  <div class="chat-box">
    <div class="chat-list" id="chatList"><div class="empty">还没有人说话，来打个招呼～</div></div>
    <div class="chat-in" id="chatIn">
      <input type="text" id="chatName" placeholder="你的称呼" maxlength="20" style="max-width:110px">
      <input type="text" id="chatText" placeholder="说点什么…" maxlength="200" autocomplete="off">
      <button id="btnSend">发送</button>
    </div>
  </div>

  <div style="height:20px"></div>
  <div class="footer" id="footer"></div>
</div>

<script src="js/store.js"></script>
<script src="js/order-id.js"></script>
<script src="js/vendor/hls.min.js"></script>
<script src="js/vendor/flv.min.js"></script>
<script src="js/live.js"></script>
</body>
</html>
