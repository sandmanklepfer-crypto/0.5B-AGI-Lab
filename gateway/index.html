<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<title>渡口 · 说一句，我带你去</title>
<style>
  :root{--bg:#06060c;--card:#12131c;--line:#242838;--tx:#eef0f8;--tx2:#8b93a8;
        --acc:#7c6cff;--glow:rgba(124,108,255,.55)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);overflow:hidden;
       font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body::before{content:"";position:fixed;inset:-30%;background:
     radial-gradient(circle at 50% 30%,rgba(124,108,255,.16),transparent 55%),
     radial-gradient(circle at 80% 80%,rgba(34,211,238,.09),transparent 50%);
     animation:float 14s ease-in-out infinite;z-index:0}
  @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-3%,3%)}}
  .app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:20px;text-align:center;min-height:0}
  .orb{width:118px;height:118px;border-radius:50%;position:relative;cursor:pointer;
       background:radial-gradient(circle at 35% 30%,#a99bff,#5b4bd6 55%,#2a2360);
       box-shadow:0 0 60px var(--glow),0 0 120px rgba(124,108,255,.25);
       animation:breathe 4s ease-in-out infinite;flex:none;display:flex;align-items:center;justify-content:center}
  .orb::after{content:"";position:absolute;inset:-14px;border-radius:50%;
       border:1px solid rgba(124,108,255,.35);animation:ring 3s ease-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .orb span{font-size:15px;font-weight:600;letter-spacing:3px;color:#fff}
  .h1{margin:24px 0 6px;font-size:24px;font-weight:600}
  .sub{color:var(--tx2);font-size:14px;max-width:340px}
  .chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:22px;max-width:430px}
  .chip{padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:rgba(18,19,28,.8);
        font-size:13.5px;color:var(--tx);cursor:pointer;transition:.16s}
  .chip:active{transform:scale(.96)} .chip:hover{border-color:var(--acc);color:#cfc8ff}
  .talk{display:none;flex-direction:column;height:100%} .talk.on{display:flex}
  .head{padding:13px 18px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
  .head .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
  .head b{font-size:15px}.head .sp{flex:1}
  .head button{background:none;border:0;color:var(--tx2);font-size:19px;cursor:pointer;padding:4px 8px}
  .msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;gap:10px;max-width:90%} .row.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;
      justify-content:center;font-size:13px;background:#2a2360;color:#c9bfff}
  .row.me .av{background:#2b3550;color:#bcd4ff}
  .bub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px}
  .row.me .bub{background:#1b2338;border-color:#2b3550}
  .dest{margin-top:10px;display:flex;flex-direction:column;gap:8px}
  .d{display:flex;align-items:center;gap:11px;background:rgba(124,108,255,.10);
     border:1px solid rgba(124,108,255,.35);border-radius:12px;padding:12px 14px;
     text-decoration:none;color:var(--tx);transition:.16s}
  .d:active{transform:scale(.98)} .d:hover{background:rgba(124,108,255,.18)}
  .d .ic{width:30px;height:30px;border-radius:9px;background:rgba(124,108,255,.22);
         display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
  .d .go{margin-left:auto;color:var(--tx2);font-size:13px}
  .inputbar{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:flex-end;
            background:rgba(6,6,12,.7)}
  .inputbar textarea{flex:1;resize:none;background:#0e0f18;border:1px solid var(--line);border-radius:13px;
     color:var(--tx);padding:11px 14px;font-size:15px;font-family:inherit;outline:none;max-height:120px;line-height:1.5}
  .inputbar textarea:focus{border-color:var(--acc)}
  .inputbar button{width:44px;height:44px;border-radius:13px;border:0;background:var(--acc);color:#fff;
     font-size:19px;cursor:pointer;flex:none}
  .inputbar button:disabled{opacity:.4}
  .hint{color:var(--tx2);font-size:12px;text-align:center;padding:0 0 8px}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--tx2);animation:bl 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="orb" id="orb"><span>渡口</span></div>
    <div class="h1">说一句，我带你去</div>
    <div class="sub">想吃什么、想玩什么、想开店——告诉我，我送你到该去的地方。</div>
    <div class="chips">
      <div class="chip" data-q="我想喝奶茶">🥤 想喝奶茶</div>
      <div class="chip" data-q="来点水果">🍉 买点水果</div>
      <div class="chip" data-q="在家无聊">🎮 找点乐子</div>
      <div class="chip" data-q="我想开店卖东西">🏪 我要开店</div>
      <div class="chip" data-q="查一下我的订单">📦 查订单</div>
    </div>
  </div>

  <div class="talk" id="talk">
    <div class="head">
      <span class="dot"></span><b>渡口</b>
      <span style="color:var(--tx2);font-size:12.5px" id="mode">· AI 在线</span>
      <span class="sp"></span><button onclick="reset()">✕</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="hint">说人话就行 · 拿不准我会反问你</div>
    <div class="inputbar">
      <textarea id="inp" rows="1" placeholder="你要去哪儿？"></textarea>
      <button id="send" onclick="send()">↑</button>
    </div>
  </div>
</div>

<script>
/* ============================ 目的地白名单 ============================
   ★ 安全铁律：只有这里列出的地方能被跳转。AI 不许自己编 URL。
     否则就是开放重定向漏洞（AI 幻觉出的链接会把用户带去任何地方） */
const DESTS = [
  {slug:'yikoucha', name:'一口茶（奶茶）', url:'../s/yikoucha/index.html', icon:'🥤',
   kw:['奶茶','喝的','茶','珍珠','饮品','饮料','下午茶','冰的','解渴','波波','果茶']},
  {slug:'fruit3', name:'宿舍楼下水果', url:'../s/fruit3/index.html', icon:'🍉',
   kw:['水果','切果','果盒','苹果','西瓜','香蕉','葡萄','削','果盘']},
  {slug:'game', name:'天泪纪元（游戏）', url:'../tianlei3d/index.html', icon:'🎮',
   kw:['游戏','玩','打游戏','娱乐','天泪','上线','无聊','乐子','打发','摸鱼']},
  {slug:'join', name:'免费开店（商家入驻）', url:'../join.html', icon:'🏪',
   kw:['开店','入驻','卖东西','做个店','下单页','商家','我要卖','副业','创业']},
  {slug:'orders', name:'我的订单', url:'../orders.html', icon:'📦',
   kw:['订单','我买的','查订单','发货','到哪了','物流','进度']},
  {slug:'chat', name:'联系商家 / 客服', url:'../index.html', icon:'💬',
   kw:['客服','联系','咨询','投诉','售后','退款','找人']},
];

/* ============ AI 接入方式（按顺序尝试，哪个通就用哪个） ============
   ★ 这里没有、也永远不该有任何 API Key。
     浏览器里的 key = 公开的 key。要安全，就把 key 放服务器（见 worker.js）。 */
const AI_ENDPOINTS = [
  // 免费免 key 的公共 AI（无需任何密钥，无从被盗）
  {name:'free', build:(prompt)=>'https://text.pollinations.ai/'+encodeURIComponent(prompt)},
];
// 如果你自己部署了 Cloudflare Worker 代理（key 在服务端），把地址填这里：
const MY_PROXY = '';   // 例：'https://tianlei-ai.你的名字.workers.dev/route'

const $ = s => document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------------- 规则匹配（永远兜底，0 成本、0 延迟） ---------------- */
function ruleRoute(text){
  const hits = DESTS.map(d=>{let s=0;for(const k of d.kw) if(text.includes(k)) s+=(k.length>=2?2:1);return{s,d};})
                    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  const picked = hits.slice(0,3).map(x=>x.d);
  if(!picked.length) return {reply:'我这边能帮你：点奶茶 / 买水果 / 逛游戏 / 免费开店 / 查订单。你想干哪个？',destinations:[]};
  return {reply:`给你找到 ${picked.length} 个去处，点下面进去～`,destinations:picked,source:'rule'};
}

/* ---------------- AI 分诊 ---------------- */
function buildPrompt(text){
  const menu = DESTS.map(d=>`- ${d.slug}｜${d.name}｜关键词:${d.kw.slice(0,5).join(',')}`).join('\n');
  return `你是"渡口"，把用户一句话送到该去的地方。
只能从下面菜单选(用slug)，最多3个，按相关度排序。若说不清或不在菜单，route给空数组并在reply里礼貌反问。
只输出JSON，不要别的话：{"reply":"口语简短≤30字","route":["slug"]}

菜单:
${menu}

用户:${text}`;
}

function parseAI(raw){
  const m = String(raw).match(/\{[\s\S]*\}/);
  if(!m) return null;
  try{
    const j = JSON.parse(m[0]);
    const bySlug = Object.fromEntries(DESTS.map(d=>[d.slug,d]));
    const picked = (j.route||[]).map(s=>bySlug[s]).filter(Boolean).slice(0,3);
    return {reply: j.reply || '', destinations: picked, source:'ai'};
  }catch(e){ return null; }
}

async function fetchWithTimeout(url, ms){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), ms);
  try{ const r = await fetch(url, {signal:ctl.signal}); return r; }
  finally{ clearTimeout(t); }
}

async function aiRoute(text){
  const prompt = buildPrompt(text);
  // ① 优先用你自己的代理（key 在服务端，最稳最安全）
  if(MY_PROXY){
    try{
      const r = await fetchWithTimeout(MY_PROXY, 12000);
      if(MY_PROXY.indexOf('?')<0){
        const r2 = await fetch(MY_PROXY, {method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({text})});
        const d = await r2.json();
        if(d && d.destinations) return {reply:d.reply||'', destinations:(d.destinations||[]).map(s=>DESTS.find(x=>x.slug===s)).filter(Boolean), source:'proxy'};
      }
    }catch(e){ /* 落到免费AI */ }
  }
  // ② 免费免 key 公共 AI
  for(const ep of AI_ENDPOINTS){
    try{
      const r = await fetchWithTimeout(ep.build(prompt), 15000);
      if(!r.ok) continue;
      const raw = await r.text();
      const parsed = parseAI(raw);
      if(parsed && (parsed.destinations.length || parsed.reply)) return parsed;
    }catch(e){ /* 下一个 */ }
  }
  return null;
}

async function route(text){
  try{
    const ai = await aiRoute(text);
    if(ai) return ai;
  }catch(e){}
  return ruleRoute(text);   // ③ 永远兜底
}

/* ---------------- UI ---------------- */
function openTalk(){ $('#stage').style.display='none'; $('#talk').classList.add('on'); }
function bubble(text, me, dests){
  const row = document.createElement('div'); row.className='row'+(me?' me':'');
  let inner = `<div class="av">${me?'你':'渡'}</div><div class="bub">${esc(text)}`;
  if(dests && dests.length){
    inner += '<div class="dest">' + dests.map(d=>
      `<a class="d" href="${esc(d.url)}" target="_blank" rel="noopener">
        <span class="ic">${d.icon||'➡'}</span><b>${esc(d.name)}</b><span class="go">去 →</span></a>`).join('') + '</div>';
  }
  inner += '</div>'; row.innerHTML = inner;
  $('#msgs').appendChild(row); $('#msgs').scrollTop = $('#msgs').scrollHeight;
}
function typing(){ const r=document.createElement('div'); r.className='row'; r.id='typing';
  r.innerHTML='<div class="av">渡</div><div class="bub"><span class="typing"><i></i><i></i><i></i></span></div>';
  $('#msgs').appendChild(r); $('#msgs').scrollTop=$('#msgs').scrollHeight; }
function stopTyping(){ const t=$('#typing'); if(t)t.remove(); }

async function ask(text){
  openTalk(); bubble(text, true); typing();
  $('#send').disabled = true;
  const res = await route(text);
  stopTyping();
  bubble(res.reply||'给你找到这些：', false, res.destinations||[]);
  $('#send').disabled = false; $('#inp').focus();
}
function send(){ const v=$('#inp').value.trim(); if(!v)return; $('#inp').value=''; $('#inp').style.height='auto'; ask(v); }
function reset(){ $('#talk').classList.remove('on'); $('#stage').style.display='flex'; $('#msgs').innerHTML=''; }

$('#orb').onclick = ()=>{ openTalk(); $('#inp').focus(); };
document.querySelectorAll('.chip').forEach(c=> c.onclick = ()=> ask(c.dataset.q));
$('#inp').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
$('#inp').addEventListener('input', e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'; });
setTimeout(()=>{ if(!$('#msgs').children.length){ openTalk(); bubble('你好，我是渡口～想去哪，跟我说一句就行。', false); } }, 400);
</script>
</body>
</html>
