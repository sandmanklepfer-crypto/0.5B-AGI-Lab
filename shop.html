<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffb199">
<title>商家工作台 · 卤味小店</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body class="wb">

<div class="phone">
  <div class="wb-body">

    <!-- ============ 门店信息 ============ -->
    <header class="shop-head">
      <button class="dots" id="btnMore" aria-label="更多">⋮</button>
      <div class="avatar" id="shopAvatar"><span>满满小店</span></div>
      <div class="shop-id">
        <div class="shop-name" id="shopName">满满小店</div>
        <div class="shop-score">商家体验分 <b id="shopScore">4.5</b></div>
      </div>
      <button class="service-btn" id="btnService">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a7 7 0 0 1 14 0"/><rect x="3.5" y="13" width="3.5" height="6" rx="1.7"/><rect x="17" y="13" width="3.5" height="6" rx="1.7"/><path d="M19 19a3 3 0 0 1-3 2.5h-3"/></svg>
        <span>联系客服</span>
      </button>
    </header>

    <!-- ============ 数据统计 ============ -->
    <section class="stat-card">
      <div class="stat"><div class="k">今日销售额</div><div class="v money" id="stSales">¥0</div></div>
      <div class="stat"><div class="k">待处理订单</div><div class="v" id="stPending">0</div></div>
      <div class="stat"><div class="k">商品总数</div><div class="v" id="stGoods">0</div></div>
    </section>

    <!-- ============ 活动横幅 + 功能菜单 ============ -->
    <section class="panel menu-card">
      <button class="banner" id="banner">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        <span id="bannerText">盛世华诞启新章 好物相伴度金秋</span>
      </button>
      <div class="menu-grid" id="menuGrid"></div>
    </section>

    <!-- ============ 爆款榜单 ============ -->
    <section class="panel pick-card" id="hotSec">
      <div class="pick-head">
        <h2 id="hotTitle">爆款榜单</h2>
        <span class="tag hot" id="hotTag">热门</span>
        <button class="more" data-more="hot">查看更多 ›</button>
      </div>
      <div class="hot-row" id="hotRow"></div>
    </section>

    <!-- ============ 精选现货 ============ -->
    <section class="panel pick-card" id="stockSec">
      <div class="pick-head">
        <h2 id="stockTitle">精选现货</h2>
        <span class="tag new" id="stockTag">New</span>
        <button class="more" data-more="stock">查看更多 ›</button>
      </div>
      <div id="stockRow"></div>
    </section>

    <div class="wb-foot" id="connTip">正在读取数据…</div>
  </div>

  <!-- ============ 底部导航 ============ -->
  <nav class="tabbar" id="tabbar"></nav>
</div>

<!-- ============ 通用抽屉 ============ -->
<div class="sheet-mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="head"><h2 id="sheetTitle">标题</h2><button class="close-x" data-close>✕</button></div>
  <div class="content" id="sheetBody"></div>
</div>

<script src="js/store.js"></script>
<script src="js/gh.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
