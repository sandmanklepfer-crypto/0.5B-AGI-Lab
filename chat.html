<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<title>联系商家 · 卤味小店</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;padding-bottom:0;background:#f2ede8}
  .c-head{background:linear-gradient(160deg,#c0392b,#8e2418);color:#fff;padding:11px 0;flex:0 0 auto}
  .c-head .in{max-width:720px;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
  .c-head .nm{flex:1;min-width:0}
  .c-head h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-head .sub{font-size:11.5px;opacity:.85;margin-top:2px}
  .c-head a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);
    border-radius:20px;padding:5px 12px;font-size:12.5px;flex:0 0 auto}

  .msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .msgs .in{max-width:720px;margin:0 auto}
  .b{display:flex;margin-bottom:13px;align-items:flex-end;gap:8px}
  .b.me{flex-direction:row-reverse}
  .b .av{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:flex;
    align-items:center;justify-content:center;font-size:16px;background:#fff;box-shadow:var(--shadow)}
  .b.me .av{background:var(--brand);color:#fff}
  .b .tx{max-width:76%;padding:10px 13px;border-radius:16px;background:#fff;
    box-shadow:var(--shadow);font-size:14.5px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
  .b.me .tx{background:var(--brand);color:#fff}
  .b .tm{font-size:10.5px;color:var(--muted);margin:0 4px;flex:0 0 auto}
  .day{text-align:center;font-size:11.5px;color:var(--muted);margin:14px 0 12px}
  .tip{text-align:center;font-size:12px;color:var(--muted);line-height:1.8;
    background:#fff8e6;border:1px solid #f0d9a0;color:#8a6100;border-radius:12px;padding:10px;margin:12px 0}

  .bar{flex:0 0 auto;background:#fdfaf7;border-top:1px solid var(--line);padding:9px 12px;
    padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  .bar .in{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .bar textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;font-size:15px;line-height:1.45;max-height:100px;outline:none;
    background:#fff;font-family:inherit}
  .bar textarea:focus{border-color:var(--brand)}
  .bar button{flex:0 0 auto;padding:11px 20px;border-radius:14px;background:var(--brand);
    color:#fff;font-weight:700;font-size:14.5px}
  .bar button:disabled{opacity:.45}

  .gate{position:fixed;inset:0;background:rgba(36,26,21,.55);z-index:150;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .card{background:#fff;border-radius:18px;padding:20px;width:min(340px,100%);
    box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .gate h2{margin:0 0 6px;font-size:17px}
  .gate p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.75}
  .gate input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;
    font-size:16px;outline:none;margin-bottom:10px}
  .gate input:focus{border-color:var(--brand)}
  .gate button{width:100%;padding:12px;border-radius:12px;background:var(--brand);
    color:#fff;font-weight:700;font-size:15px}
  .gate .err{color:var(--brand);font-size:12.5px;margin-top:8px;text-align:center;min-height:17px}
</style>
</head>
<body>

<header class="c-head">
  <div class="in">
    <div class="nm">
      <h1 id="shopName">卤味小店</h1>
      <div class="sub" id="subLine">有问题直接问，看到就回</div>
    </div>
    <a href="./">🛒 去下单</a>
  </div>
</header>

<div class="msgs" id="msgs"><div class="in" id="msgsIn"></div></div>

<div class="bar">
  <div class="in">
    <textarea id="input" rows="1" placeholder="说点什么…" maxlength="500"></textarea>
    <button id="btnSend">发送</button>
  </div>
</div>

<!-- 首次进来要手机号 -->
<div class="gate" id="gate">
  <div class="card">
    <h2>👋 先留个手机号</h2>
    <p>方便老板认人，也能让你下次打开继续聊。<br>不注册、不验证码。</p>
    <input type="tel" id="phoneIn" inputmode="numeric" placeholder="11 位手机号" maxlength="11">
    <button id="btnEnter">开始聊天</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
