<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>FLM 学院 · 从噪音到大师</title>
<style>
/* ===========================================================
   FLM 学院 —— 从噪音到大师
   =========================================================== */
:root{
  --bg:#0a0c11; --bg2:#0d1017;
  --panel:#131722; --panel2:#171c28; --panel3:#1d2432;
  --line:#252d3d; --line2:#333d52;
  --txt:#e9edf6; --dim:#8c96ac; --dim2:#6b7488;
  --orange:#ff9e2c; --orange2:#ffb75e;
  --cyan:#3ee0ff; --violet:#a78bfa; --green:#4ade80; --red:#ff5c7a; --pink:#ff7ab6;
  --r:14px; --r2:10px;
  --sh:0 18px 50px rgba(0,0,0,.45);
  --ff:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-family:var(--ff);
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  padding-top:64px; padding-left:224px; min-height:100vh; overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3346;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);z-index:0;pointer-events:none;opacity:.5}
.bg-glow-a{width:620px;height:620px;background:radial-gradient(circle,rgba(255,158,44,.18),transparent 65%);top:-220px;right:-120px}
.bg-glow-b{width:700px;height:700px;background:radial-gradient(circle,rgba(120,90,255,.16),transparent 65%);bottom:-300px;left:80px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:60;
  display:flex;align-items:center;gap:18px;padding:0 20px;
  background:rgba(11,14,20,.86);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:180px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#141414;
  background:linear-gradient(150deg,var(--orange),#ffcf7a);box-shadow:0 6px 18px rgba(255,158,44,.35)
}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-size:15.5px;letter-spacing:.5px}
.brand-txt i{font-size:10.5px;color:var(--dim2);font-style:normal;letter-spacing:2.4px}
.top-mid{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.rank-chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);font-size:12.5px;white-space:nowrap;
  font-weight:600;letter-spacing:.3px
}
.rank-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.xp-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:420px}
.xp-bar{height:7px;flex:1;background:#1a2030;border-radius:99px;overflow:hidden}
.xp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffd08a);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-txt{font-size:11.5px;color:var(--dim);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.top-right{display:flex;align-items:center;gap:8px}
.vol{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.vol input[type=range]{width:74px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--txt);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:.18s
}
.icon-btn:hover{background:var(--panel3);border-color:var(--line2);transform:translateY(-1px)}
.only-mobile{display:none}

input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:#232c3d;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(255,158,44,.18);cursor:pointer}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--orange);cursor:pointer}

/* ---------- 左侧栏 ---------- */
.rail{
  position:fixed;top:64px;left:0;bottom:0;width:224px;z-index:50;
  border-right:1px solid var(--line);background:rgba(12,15,22,.72);
  display:flex;flex-direction:column;padding:16px 12px;gap:16px;overflow-y:auto
}
.rail-nav{display:flex;flex-direction:column;gap:3px}
.rail-nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--dim);font-size:14px;font-weight:500;transition:.16s;border:1px solid transparent
}
.rail-nav a:hover{background:var(--panel);color:var(--txt)}
.rail-nav a.on{background:linear-gradient(90deg,rgba(255,158,44,.14),rgba(255,158,44,.02));color:var(--orange2);border-color:rgba(255,158,44,.22)}
.nico{font-size:14px;width:18px;text-align:center;opacity:.9}
.rail-levels{margin-top:2px;display:flex;flex-direction:column;gap:2px}
.rail-levels .rl-title{font-size:10.5px;letter-spacing:2px;color:var(--dim2);padding:6px 12px 4px;text-transform:uppercase}
.rl-item{
  display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:9px;font-size:12.5px;color:var(--dim);
  cursor:pointer;transition:.15s
}
.rl-item:hover{background:var(--panel);color:var(--txt)}
.rl-item.on{background:var(--panel);color:var(--txt)}
.rl-dot{width:8px;height:8px;border-radius:50%;background:#38425a;flex:none}
.rl-item.done .rl-dot{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.7)}
.rl-item.locked{opacity:.45}
.rail-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.mp-head{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.mp-head b{color:var(--orange2);font-size:12px}
.mp-bar{height:6px;background:#1a2030;border-radius:99px;margin:7px 0 6px;overflow:hidden}
.mp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--cyan));transition:width .5s}
.mp-sub{font-size:10.5px;color:var(--dim2)}
.rail-scrim{display:none}

/* ---------- 主视图 ---------- */
.view{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:30px 34px 90px}
.page{animation:pageIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 通用 ---------- */
.card{background:linear-gradient(180deg,var(--panel),#11151f);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.pad-lg{padding:26px}
.muted{color:var(--dim)}
.tiny{font-size:12px;color:var(--dim2)}
h1,h2,h3,h4{margin:0;line-height:1.35;letter-spacing:.2px}
.h1{font-size:32px;font-weight:800}
.h2{font-size:21px;font-weight:750}
.h3{font-size:16px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.center{text-align:center}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);
  color:var(--txt);font-weight:600;font-size:14px;cursor:pointer;transition:.16s;white-space:nowrap
}
.btn:hover{background:var(--panel3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.primary{background:linear-gradient(135deg,var(--orange),#ffb659);color:#191307;border-color:transparent;box-shadow:0 8px 22px rgba(255,158,44,.28)}
.btn.primary:hover{box-shadow:0 10px 28px rgba(255,158,44,.42)}
.btn.ghost{background:transparent}
.btn.done{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:#8df0b3}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:14px 26px;font-size:15.5px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn .kbd{font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
.pill.ok{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.1)}
.pill.todo{color:var(--dim)}
.pill.warn{color:var(--orange);border-color:rgba(255,158,44,.35);background:rgba(255,158,44,.1)}

/* ---------- 首页 ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);
  background:
    radial-gradient(900px 300px at 12% -20%,rgba(255,158,44,.16),transparent 60%),
    radial-gradient(700px 300px at 88% 120%,rgba(120,90,255,.16),transparent 60%),
    linear-gradient(160deg,#151a26,#0e121a);
  padding:34px 36px;display:grid;grid-template-columns:1.35fr .9fr;gap:24px;align-items:center
}
.hero h1{font-size:38px;letter-spacing:-.5px;line-height:1.25}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--orange),#ffd79a 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);margin:12px 0 0;max-width:520px}
.hero-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.hero-side{display:flex;flex-direction:column;gap:12px}
.hero-stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim2);letter-spacing:.5px}
.hero-badge{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;
  background:linear-gradient(120deg,rgba(255,158,44,.12),rgba(255,158,44,.02));border:1px solid rgba(255,158,44,.25)
}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.ring .rv small{font-size:9px;color:var(--dim);font-weight:500;display:block;text-align:center;line-height:1}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin:38px 0 16px;gap:12px}
.section-head .sub{font-size:12.5px;color:var(--dim2)}

/* 关卡路径 */
.path{position:relative;display:flex;flex-direction:column;gap:14px}
.path::before{content:"";position:absolute;left:33px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,rgba(255,158,44,.5),rgba(120,90,255,.4),rgba(74,222,128,.35));opacity:.35}
.lvl{
  position:relative;display:grid;grid-template-columns:68px 1fr auto;gap:18px;align-items:center;
  background:linear-gradient(100deg,var(--panel),#11151f);border:1px solid var(--line);border-radius:16px;
  padding:18px 22px;cursor:pointer;transition:.2s
}
.lvl:hover{border-color:var(--line2);transform:translateX(3px);background:linear-gradient(100deg,#171d2a,#12161f)}
.lvl.locked{opacity:.55;cursor:not-allowed;transform:none}
.lvl.locked:hover{transform:none;border-color:var(--line)}
.lvl-dot{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;
  background:var(--panel3);border:1px solid var(--line2);position:relative;z-index:1;font-variant-numeric:tabular-nums
}
.lvl.done .lvl-dot{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.45);color:var(--green)}
.lvl.cur .lvl-dot{background:linear-gradient(140deg,var(--orange),#ffc873);color:#1a1305;border-color:transparent;box-shadow:0 0 0 5px rgba(255,158,44,.12),0 10px 24px rgba(255,158,44,.3)}
.lvl-main h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-main p{margin:3px 0 0;font-size:12.8px;color:var(--dim)}
.lvl-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.lvl-side{display:flex;align-items:center;gap:12px}
.lvl-bar{width:96px;height:6px;border-radius:99px;background:#1a2030;overflow:hidden}
.lvl-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.lvl-pct{font-size:11.5px;color:var(--dim);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* 成就 */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ach{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);opacity:.55;transition:.2s}
.ach.on{opacity:1;border-color:rgba(255,158,44,.3);background:linear-gradient(120deg,rgba(255,158,44,.08),var(--panel))}
.ach-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--panel3);flex:none}
.ach b{display:block;font-size:13.5px}
.ach span{font-size:11px;color:var(--dim);line-height:1.4;display:block}

/* ---------- 关卡页 ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim2);margin-bottom:14px}
.crumbs a:hover{color:var(--orange2)}
.crumbs .sep{opacity:.5}
.lvl-hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}
.lvl-hero .h1{font-size:30px}
.lvl-hero p{color:var(--dim);margin:8px 0 0;max-width:620px}
.lesson-list{display:flex;flex-direction:column;gap:10px}
.lesson-row{
  display:grid;grid-template-columns:44px 1fr auto;gap:16px;align-items:center;
  padding:16px 18px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;transition:.18s
}
.lesson-row:hover{border-color:var(--line2);background:var(--panel2)}
.lesson-row.locked{opacity:.5;cursor:not-allowed}
.lesson-row.locked:hover{border-color:var(--line);background:var(--panel)}
.lr-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--panel3);border:1px solid var(--line)}
.lesson-row.done .lr-ico{background:rgba(74,222,128,.13);border-color:rgba(74,222,128,.35);color:var(--green)}
.lesson-row .tag{font-size:10.5px;letter-spacing:1.6px;color:var(--dim2);text-transform:uppercase}
.lesson-row h4{font-size:15px;font-weight:650;margin:1px 0 2px}
.lesson-row p{margin:0;font-size:12px;color:var(--dim)}
.lr-right{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.lr-xp{font-size:11px;color:var(--orange2);background:rgba(255,158,44,.1);border:1px solid rgba(255,158,44,.22);padding:2px 8px;border-radius:99px}

/* ---------- 课程页 ---------- */
.lesson-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.lesson-head{margin-bottom:18px}
.lesson-head .kicker{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--orange);text-transform:uppercase;font-weight:700}
.lesson-head h1{font-size:29px;margin-top:6px;letter-spacing:-.3px}
.lesson-head .lead{color:var(--dim);margin-top:8px;font-size:14.5px;max-width:720px}
.steps{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.step-chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim2);padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.step-chip b{color:var(--dim);font-variant-numeric:tabular-nums}
.step-chip.on{color:var(--orange2);border-color:rgba(255,158,44,.4);background:rgba(255,158,44,.08)}
.step-chip.on b{color:var(--orange)}

.blocks{display:flex;flex-direction:column;gap:16px}
.block{animation:pageIn .35s backwards}
.block:nth-child(2){animation-delay:.03s}.block:nth-child(3){animation-delay:.06s}
.b-p{color:#c3cbdc;margin:0;font-size:14.6px;line-height:1.85}
.b-p b,.b-p strong{color:#fff}
.b-p code,.b-tip code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;color:var(--orange2)}
.b-h{font-size:18px;font-weight:750;display:flex;align-items:center;gap:9px;margin-top:6px}
.b-h::before{content:"";width:3px;height:16px;border-radius:2px;background:var(--orange)}
.b-box{border-radius:12px;padding:14px 16px 14px 46px;position:relative;font-size:13.6px;line-height:1.75;border:1px solid}
.b-box::before{position:absolute;left:14px;top:13px;font-size:15px}
.b-box.tip{background:rgba(62,224,255,.06);border-color:rgba(62,224,255,.22);color:#b6e9f5}
.b-box.tip::before{content:"💡"}
.b-box.warn{background:rgba(255,158,44,.07);border-color:rgba(255,158,44,.24);color:#f5d9b6}
.b-box.warn::before{content:"⚠️"}
.b-box.note{background:rgba(167,139,250,.07);border-color:rgba(167,139,250,.22);color:#d7cdf7}
.b-box.note::before{content:"📌"}
.b-box.ok{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.22);color:#c2f3d3}
.b-box.ok::before{content:"✅"}
.b-box b{color:#fff}
.b-quote{border-left:3px solid var(--line2);padding:2px 0 2px 16px;color:var(--dim);font-size:14px;font-style:italic}

/* 试听 A/B */
.demo{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#141926,#111520);overflow:hidden}
.demo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.demo-head .t{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
.demo-head .t .k{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--cyan);border:1px solid rgba(62,224,255,.3);background:rgba(62,224,255,.08);padding:2px 6px;border-radius:4px}
.demo-body{padding:14px 16px}
.demo-items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.demo-btn{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:11px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel2);text-align:left;transition:.16s;color:var(--txt)
}
.demo-btn:hover{border-color:var(--line2);background:var(--panel3)}
.demo-btn.on{border-color:rgba(255,158,44,.5);background:rgba(255,158,44,.08);box-shadow:0 0 0 3px rgba(255,158,44,.08)}
.demo-btn .play{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--panel3);flex:none;font-size:12px;color:var(--orange2)}
.demo-btn.on .play{background:var(--orange);color:#171006}
.demo-btn .lbl{font-size:13px;font-weight:600;line-height:1.3}
.demo-btn .sub{font-size:10.5px;color:var(--dim2);margin-top:2px}
.demo-note{font-size:11.5px;color:var(--dim2);margin-top:9px}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px}
.eq i{width:3px;background:currentColor;border-radius:2px;opacity:.5;height:30%}
.demo-btn.on .eq i{animation:eqb .7s infinite ease-in-out alternate}
.demo-btn.on .eq i:nth-child(2){animation-delay:.12s}
.demo-btn.on .eq i:nth-child(3){animation-delay:.24s}
.demo-btn.on .eq i:nth-child(4){animation-delay:.36s}
@keyframes eqb{from{height:20%}to{height:100%}}

/* 小测 */
.quiz{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.quiz-head{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:650}
.quiz-head span{color:var(--orange);margin-right:6px}
.quiz-opts{padding:10px;display:flex;flex-direction:column;gap:7px}
.quiz-opt{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:13.4px;transition:.15s;text-align:left;color:var(--txt)}
.quiz-opt:hover{border-color:var(--line2);background:var(--panel3)}
.quiz-opt .k{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;color:var(--dim);flex:none}
.quiz-opt.correct{border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.quiz-opt.correct .k{background:var(--green);color:#08240f;border-color:transparent}
.quiz-opt.wrong{border-color:rgba(255,92,122,.5);background:rgba(255,92,122,.08)}
.quiz-opt.wrong .k{background:var(--red);color:#2a0710;border-color:transparent}
.quiz-explain{margin:0 10px 12px;padding:10px 12px;border-radius:9px;background:rgba(62,224,255,.06);border:1px solid rgba(62,224,255,.18);font-size:12.5px;color:#b6e9f5;display:none}
.quiz-explain.show{display:block}

/* 右侧任务栏 */
.side-sticky{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.task-card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#151a27,#111520);overflow:hidden}
.task-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.task-head b{font-size:12.5px;letter-spacing:.5px}
.task-head .cnt{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.task-list{padding:8px;display:flex;flex-direction:column;gap:2px;margin:0;list-style:none}
.task-list li{display:flex;gap:9px;padding:8px 8px;border-radius:8px;font-size:12.4px;color:var(--dim);line-height:1.5;transition:.2s}
.task-list li .box{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;color:transparent;transition:.2s}
.task-list li.ok{color:#b9f0cd}
.task-list li.ok .box{background:var(--green);border-color:var(--green);color:#07230f}
.task-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lesson-nav{display:flex;gap:8px}
.lesson-nav .btn{flex:1}

/* 进度条 in lesson */
.lesson-progress{height:3px;border-radius:99px;background:#1a2030;overflow:hidden;margin-bottom:18px}
.lesson-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--cyan));transition:width .4s}

/* ---------- 网格音序器 ---------- */
.lab{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#121722,#0f131c);overflow:hidden}
.lab-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:rgba(255,255,255,.015)}
.lab-bar .sp{flex:1}
.transport{display:flex;align-items:center;gap:8px}
.play-btn{
  width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--orange),#ffbe6a);color:#1a1204;font-size:14px;box-shadow:0 6px 16px rgba(255,158,44,.3);transition:.16s
}
.play-btn:hover{transform:scale(1.05)}
.play-btn.playing{background:linear-gradient(140deg,#ff5c7a,#ff8fa5);box-shadow:0 6px 16px rgba(255,92,122,.3)}
.bpm-box{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:11.5px;color:var(--dim)}
.bpm-box input{width:46px;background:transparent;border:0;color:var(--txt);font-family:inherit;font-size:13px;font-weight:700;text-align:center;outline:none;font-variant-numeric:tabular-nums}
.pos-read{font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums;min-width:74px;text-align:right}

.grid-scroll{overflow-x:auto;padding:12px 12px 8px}
.grid{display:grid;gap:4px;min-width:620px}
.grid-row{display:grid;grid-template-columns:96px repeat(16,1fr);gap:4px;align-items:center}
.grid-label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);cursor:pointer;user-select:none}
.grid-label .sq{width:15px;height:15px;border-radius:4px;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;color:transparent;flex:none}
.grid-label.on .sq{background:var(--orange);border-color:var(--orange);color:#1a1204}
.grid-label.on{color:var(--txt)}
.step-cell{
  height:30px;border-radius:5px;border:1px solid #222a3a;background:#161b27;cursor:pointer;transition:background .1s,border-color .1s,transform .05s;position:relative
}
.step-cell:hover{background:#1e2534;border-color:#38445c}
.step-cell.on{background:linear-gradient(180deg,#ffb158,#f08a15);border-color:#ffc071;box-shadow:0 0 10px rgba(255,158,44,.28)}
.step-cell.beat{background:#1a2130}
.step-cell.beat:hover{background:#222b3d}
.step-cell.on.beat{background:linear-gradient(180deg,#ffb158,#f08a15)}
.step-cell.ph{outline:1px solid rgba(62,224,255,.5);outline-offset:-1px}
.step-cell.ph::after{content:"";position:absolute;inset:0;border-radius:4px;background:rgba(62,224,255,.12)}
.grid-ruler{display:grid;grid-template-columns:96px repeat(16,1fr);gap:4px;margin-bottom:3px}
.grid-ruler span{font-size:9.5px;color:var(--dim2);text-align:center;font-variant-numeric:tabular-nums}
.grid-ruler span.b{color:var(--txt);font-weight:700}
.grid-ruler span:first-child{text-align:left;padding-left:2px;letter-spacing:1px}
.lab-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab-goals{display:flex;flex-wrap:wrap;gap:6px}
.goal{display:flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);background:var(--panel2);transition:.2s}
.goal.ok{color:#9df0bb;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.1)}
.goal .g{font-size:10px}
.lab-extra{padding:10px 12px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10.5px;letter-spacing:1px;color:var(--dim2);text-transform:uppercase}
.field select,.field input[type=text]{
  background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12.5px;outline:none;width:100%
}
.field select:focus{border-color:rgba(255,158,44,.5)}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;padding:7px 0}
.switch input{display:none}
.switch .track{width:34px;height:19px;border-radius:99px;background:#242c3d;border:1px solid var(--line2);position:relative;transition:.2s;flex:none}
.switch .track::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#7c869b;top:2px;left:2px;transition:.2s}
.switch input:checked + .track{background:rgba(255,158,44,.25);border-color:rgba(255,158,44,.6)}
.switch input:checked + .track::after{left:17px;background:var(--orange)}

/* 段落编排 */
.arr{display:flex;flex-direction:column;gap:12px}
.arr-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.arr-slot{height:52px;border:1px dashed var(--line2);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--dim2);background:rgba(255,255,255,.015);transition:.18s}
.arr-slot.filled{border-style:solid;border-color:var(--line2);background:var(--panel2);color:var(--txt);font-weight:600;font-size:11.5px;flex-direction:row;gap:6px}
.arr-slot .x{font-size:11px;color:var(--dim2);cursor:pointer;padding:0 2px}
.arr-slot .bars{font-size:9.5px;color:var(--dim2);font-weight:400}
.arr-pool{display:flex;gap:7px;flex-wrap:wrap}
.arr-chip{padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-size:12px;cursor:pointer;transition:.15s;color:var(--txt)}
.arr-chip:hover{background:var(--panel3);border-color:var(--orange)}
.arr-chip.used{opacity:.3;pointer-events:none}
.arr-chip small{display:block;font-size:9.5px;color:var(--dim2)}

/* 调音台 */
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;padding:14px 12px}
.strip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.strip .nm{font-size:10.5px;color:var(--dim);letter-spacing:.3px}
.strip .fader{writing-mode:vertical-lr;direction:rtl;width:6px;height:92px;padding:0}
.strip .val{font-size:10.5px;color:var(--txt);font-variant-numeric:tabular-nums;font-weight:600}
.strip .meter{width:6px;height:0}
.mix-sub{padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mix-opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.mix-opt .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:6px}
.mix-opt .hd b{font-size:11.5px}
.mix-opt .v{font-size:11px;color:var(--orange2);font-variant-numeric:tabular-nums}
.master-meter{height:8px;border-radius:99px;background:#1a2030;overflow:hidden;position:relative;margin-top:6px}
.master-meter i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--green),#d7ff70 65%,var(--orange) 85%,var(--red));transition:width .08s}
.master-meter .clip{position:absolute;right:0;top:0;bottom:0;width:8%;background:rgba(255,92,122,.25);opacity:0}
.master-meter.clipped .clip{opacity:1;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.2}}

/* 键盘 */
.piano-wrap{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#121722,#0e121a);overflow:hidden}
.piano-bar{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.piano-bar .sp{flex:1}
.kb-scroll{overflow-x:auto;padding:14px 12px 16px}
.kb{position:relative;height:132px;min-width:560px;display:flex;user-select:none;touch-action:manipulation}
.key{
  position:relative;border-radius:0 0 6px 6px;border:1px solid #0b0e14;cursor:pointer;transition:background .06s,transform .06s;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:9px;color:#5b6478
}
.key.w{background:linear-gradient(180deg,#f3f5fa,#cfd6e4);height:100%;flex:1;z-index:1;margin:0 1px;border-top:0}
.key.w:hover{background:linear-gradient(180deg,#fff,#dfe6f4)}
.key.w.down{background:linear-gradient(180deg,#ffd79a,#ffb75e);color:#5a3c07}
.key.w.hl{background:linear-gradient(180deg,#bdf0ff,#7fdcff);color:#044b60}
.key.b{position:absolute;width:5.6%;height:62%;background:linear-gradient(180deg,#2b3242,#171c27);z-index:2;border-radius:0 0 5px 5px;color:#8b95ab;font-size:8px}
.key.b:hover{background:linear-gradient(180deg,#39435a,#202634)}
.key.b.down{background:linear-gradient(180deg,#ffb158,#d97c00);color:#2a1b02}
.key.b.hl{background:linear-gradient(180deg,#5ad6ff,#1fa9d6);color:#032c38}
.key .lab{font-size:8.5px;opacity:.6;pointer-events:none}
.key .mid{display:none}
.kb-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--dim2);padding:0 14px 12px}
.kb-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.piano-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px}
.info-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2)}
.info-box .k{font-size:10px;letter-spacing:1.2px;color:var(--dim2);text-transform:uppercase}
.info-box .v{font-size:14px;font-weight:700;margin-top:2px}
.info-box .v small{font-size:11px;color:var(--dim);font-weight:400}

/* 跟弹提示 */
.guide-banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:rgba(62,224,255,.07);border:1px solid rgba(62,224,255,.22);font-size:12px;color:#b6e9f5;margin:0 12px 10px}
.guide-banner b{color:#fff}
.seq-dots{display:flex;gap:5px;flex-wrap:wrap}
.seq-dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px;color:var(--dim);background:var(--panel2);transition:.15s}
.seq-dot.now{border-color:var(--cyan);color:#fff;box-shadow:0 0 0 3px rgba(62,224,255,.12);background:rgba(62,224,255,.12)}
.seq-dot.ok{background:rgba(74,222,128,.16);border-color:rgba(74,222,128,.45);color:#a9f3c3}
.seq-dot.bad{background:rgba(255,92,122,.16);border-color:rgba(255,92,122,.45);color:#ffb3c1}

/* 跟拍 */
.tap-pad{
  height:150px;border-radius:14px;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 30%,#202a3d,#121722);cursor:pointer;transition:.08s;user-select:none
}
.tap-pad:active,.tap-pad.hit{transform:scale(.985);background:radial-gradient(circle at 50% 30%,#33415c,#161d2a)}
.tap-pad .big{font-size:19px;font-weight:800;letter-spacing:1px}
.tap-pad .sub{font-size:11.5px;color:var(--dim2);margin-top:4px}
.tap-meta{display:flex;gap:16px;align-items:center;padding:10px 2px 0;font-size:11.5px;color:var(--dim)}
.tap-meta b{color:var(--orange2);font-variant-numeric:tabular-nums}
.tap-dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tap-dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;color:var(--dim2)}
.tap-dot.great{background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.5);color:#a9f3c3}
.tap-dot.good{background:rgba(255,158,44,.18);border-color:rgba(255,158,44,.45);color:#ffd7a1}
.tap-dot.bad{background:rgba(255,92,122,.16);border-color:rgba(255,92,122,.4);color:#ffb3c1}

/* ---------- 工作台 ---------- */
.studio-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.preset{padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;cursor:pointer;transition:.16s;color:var(--dim)}
.preset:hover{color:var(--txt);border-color:var(--line2)}
.preset.on{color:var(--orange2);border-color:rgba(255,158,44,.45);background:rgba(255,158,44,.08)}
.studio-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:14px}

/* ---------- 证书 ---------- */
.cert-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.cert{
  width:100%;max-width:820px;aspect-ratio:1.414/1;border-radius:6px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#fdfaf3,#f3ead7);color:#2a2418;padding:7% 9%;
  box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 1px rgba(0,0,0,.08)
}
.cert::before{content:"";position:absolute;inset:18px;border:1px solid rgba(150,110,40,.35);pointer-events:none}
.cert::after{content:"";position:absolute;inset:24px;border:1px solid rgba(150,110,40,.16);pointer-events:none}
.cert .brandline{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:3px;color:#8a7038;text-transform:uppercase}
.cert h2{font-family:Georgia,"Songti SC",serif;font-size:clamp(24px,4.4vw,40px);letter-spacing:6px;text-align:center;margin:4% 0 1%;font-weight:500}
.cert .sub{text-align:center;font-size:11px;letter-spacing:5px;color:#8a7038}
.cert .name{text-align:center;font-size:clamp(20px,3.4vw,32px);border-bottom:1px solid #b9a06a;display:inline-block;padding:0 26px 6px;margin:5% auto 0;min-width:200px;font-weight:600}
.cert .center{text-align:center}
.cert .body{font-size:max(10px,1.1vw);line-height:2;text-align:center;color:#4b4436;margin-top:4%}
.cert .seal{
  position:absolute;right:11%;bottom:15%;width:88px;height:88px;border-radius:50%;border:2px solid rgba(180,60,40,.6);
  color:rgba(180,60,40,.75);display:grid;place-items:center;font-size:10px;letter-spacing:2px;text-align:center;
  transform:rotate(-12deg);line-height:1.5;font-weight:700
}
.cert .sign{position:absolute;left:9%;bottom:13%;font-size:10px;color:#6a5a3a}
.cert .sign b{display:block;font-family:Georgia,serif;font-size:15px;color:#2a2418;margin-bottom:2px}
.cert-locked{filter:grayscale(.6);opacity:.55}

/* ---------- 弹窗 / toast / 引导 ---------- */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,10,.7);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal-box{width:100%;max-width:520px;background:linear-gradient(180deg,#171c28,#12161f);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--sh);overflow:hidden;animation:pop .25s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px}
.modal-body{padding:18px 20px;max-height:65vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row .lab b{display:block;font-size:13px}
.setting-row .lab span{font-size:11px;color:var(--dim2)}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:120;
  background:#1b2230;border:1px solid var(--line2);border-radius:12px;padding:11px 18px;font-size:13px;
  box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.28s;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:rgba(74,222,128,.45);background:linear-gradient(180deg,#152a1e,#131b18);color:#b9f0cd}
.toast.bad{border-color:rgba(255,92,122,.45);background:#2a151b;color:#ffc2cd}

/* 引导 */
.tour{position:fixed;inset:0;z-index:110;pointer-events:none;display:none}
.tour.show{display:block}
.tour-spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(3,5,9,.78);transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;border:1.5px solid rgba(255,158,44,.7)}
.tour-tip{position:absolute;width:300px;background:linear-gradient(180deg,#1b2230,#141924);border:1px solid var(--line2);border-radius:14px;padding:16px;box-shadow:var(--sh);pointer-events:auto;transition:all .28s}
.tour-tip .num{font-size:10px;letter-spacing:2px;color:var(--orange);font-weight:700}
.tour-tip h4{font-size:15px;margin:4px 0 6px}
.tour-tip p{font-size:12.5px;color:var(--dim);margin:0 0 12px;line-height:1.65}
.tour-tip .acts{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-tip .skip{font-size:11.5px;color:var(--dim2);cursor:pointer;background:none;border:0;padding:4px}

/* 结果条 */
.result-bar{padding:11px 14px;border-radius:10px;font-size:12.5px;display:flex;align-items:center;gap:9px;border:1px solid}
.result-bar.good{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.3);color:#b9f0cd}
.result-bar.mid{background:rgba(255,158,44,.08);border-color:rgba(255,158,44,.3);color:#ffd7a1}
.result-bar.bad{background:rgba(255,92,122,.08);border-color:rgba(255,92,122,.3);color:#ffc2cd}

/* 细节 */
kbd{font-family:ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:5px;background:#1c2333;border:1px solid var(--line2);border-bottom-width:2px;color:var(--txt)}
.hr{height:1px;background:var(--line);margin:22px 0}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel2)}
.term b{display:block;font-size:12.5px}
.term span{font-size:11.5px;color:var(--dim);line-height:1.55;display:block;margin-top:2px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--panel2);font-size:11.5px;cursor:pointer;color:var(--dim);transition:.15s}

.chip.on{color:#1a1204;background:var(--orange);border-color:var(--orange);font-weight:600}

/* ---------- 响应式 ---------- */
@media (max-width:1080px){
  .lesson-wrap{grid-template-columns:1fr}
  .side-sticky{position:static;flex-direction:row;flex-wrap:wrap}
  .task-card{flex:1;min-width:260px}
  .studio-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  body{padding-left:0;padding-top:58px}
  .topbar{height:58px;padding:0 12px;gap:10px}
  .top-mid .xp-wrap{display:none}
  .brand{min-width:0}.brand-txt i{display:none}
  .vol{display:none}
  .only-mobile{display:grid}
  .rail{
    position:fixed;top:0;bottom:0;left:0;width:236px;padding-top:16px;z-index:80;
    transform:translateX(-104%);transition:transform .26s cubic-bezier(.2,.8,.2,1);background:#0d1118
  }
  .rail.open{transform:none;box-shadow:30px 0 60px rgba(0,0,0,.5)}
  .rail-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70}
  .rail-scrim.show{display:block}
  .view{padding:20px 14px 80px}
  .hero{grid-template-columns:1fr;padding:24px 20px}
  .hero h1{font-size:27px}
  .hero-side{display:none}
  .lvl{grid-template-columns:48px 1fr;padding:14px;gap:12px}
  .lvl-dot{width:40px;height:40px;border-radius:12px}
  .lvl-side{display:none}
  .path::before{left:26px}
  .h1{font-size:25px}
  .lesson-head h1{font-size:23px}
  .demo-items{grid-template-columns:1fr}
  .arr-slots{grid-template-columns:repeat(2,1fr)}
  .cert{aspect-ratio:auto;padding:40px 22px}
  .cert .seal{width:64px;height:64px;right:7%;bottom:9%}
  .cert .sign{position:static;margin-top:26px;text-align:center}
  .modal-body{max-height:70vh}
  .grid{min-width:560px}
  .grid-row{grid-template-columns:76px repeat(16,1fr)}
  .grid-ruler{grid-template-columns:76px repeat(16,1fr)}
  .strip .fader{height:76px}
  .kb{height:112px}
}

(function () {

  /* ---------------- 乐理 ---------------- */
  const QUAL = {

  const CHORDS = {

  // 平滑声部连接用的四声部排列（pad 用）
  const VOICE = {

  };

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const noteName = (m) => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

  const DRUM_ROWS = [
    { id: "kick", label: "底鼓", en: "Kick", sample: "kick1", key: "K" },
    { id: "snare", label: "军鼓", en: "Snare", sample: "snare1", key: "S" },

    { id: "ride", label: "叮叮镲", en: "Ride", sample: "ride1", key: "R" },
    { id: "crash", label: "强音镲", en: "Crash", sample: "crash1", key: "X" }
  ];

  /* ---------------- Pattern ---------------- */
  function pattern(o) {
    const base = {
      bpm: 128, swing: 0, bars: 4,
      drums: {
        kick: { on: true, steps: [], gain: 0.95, sample: "kick1" },
        snare: { on: true, steps: [], gain: 0.85, sample: "snare1" },
        clap: { on: false, steps: [], gain: 0.7, sample: "clap1" },
        hatc: { on: true, steps: [], gain: 0.45, sample: "hatc1" },
        hato: { on: false, steps: [], gain: 0.5, sample: "hato1" },

        crash: { on: false, steps: [], gain: 0.45, sample: "crash1" }
      },
      chords: { on: true, list: ["Am", "F", "C", "G"], mode: "pad", gain: 0.75, octave: 0, chaos: false },
      bass: { on: true, mode: "root8", gain: 0.9, chaos: false },
      lead: { on: false, mode: "arp8", gain: 0.6, chaos: false },
      fx: { riser: false, impact: false },
      gain: { drums: 1, bass: 1, chords: 1, lead: 1 },
      sidechain: true,
      arrangement: null
    };
    const out = Object.assign({}, base, o || {});
    out.drums = Object.assign({}, base.drums);
    if (o && o.drums) Object.keys(o.drums).forEach((k) => { out.drums[k] = Object.assign({}, base.drums[k], o.drums[k]); });
    out.chords = Object.assign({}, base.chords, (o && o.chords) || {});
    out.bass = Object.assign({}, base.bass, (o && o.bass) || {});
    out.lead = Object.assign({}, base.lead, (o && o.lead) || {});
    out.fx = Object.assign({}, base.fx, (o && o.fx) || {});
    out.gain = Object.assign({}, base.gain, (o && o.gain) || {});
    return out;
  }

  const range = (a, b, step) => { const r = []; for (let i = a; i < b; i += (step || 1)) r.push(i); return r; };
  const even = range(0, 16, 2);
  const offbeat = [2, 6, 10, 14];
  const quarters = [0, 4, 8, 12];

  function chaos() {
    const p = pattern({ bpm: 128 });
    const rnd = (n) => { const a = []; for (let i = 0; i < n; i++) a.push(Math.floor(Math.random() * 16)); return a; };
    p.drums.kick.steps = rnd(7);
    p.drums.snare.steps = rnd(6);
    p.drums.hatc.steps = rnd(12);
    p.drums.perc.on = true; p.drums.perc.steps = rnd(5);
    p.drums.clap.on = true; p.drums.clap.steps = rnd(4);
    p.chords.chaos = true;
    p.bass.chaos = true;
    p.lead.on = true; p.lead.chaos = true;
    p.sidechain = false;
    return p;
  }

  const DEMOS = {

    "l2-loop": () => pattern({
      drums: {

    "l3-loop": () => pattern({

        kick: { steps: quarters }, snare: { steps: [4, 12] },

  /* ---------------- 课程 ---------------- */
  const Q = (q, options, answer, explain) => ({ type: "quiz", q, options, answer, explain });

  const LEVELS = [
    /* ================= Lv.0 ================= */
    {

    dlp.type = "lowpass";
    dlp.frequency.value = 3200;
    delReturn = ctx.createGain();
    delReturn.gain.value = 0.4;
    delIn.connect(delNode);
    delNode.connect(dlp);
    dlp.connect(fb);
    fb.connect(delNode);
    delNode.connect(delReturn);
    delReturn.connect(limiter);

    return ctx;
  }

  function makeIR(dur, decay) {
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * dur);
    const b = ctx.createBuffer(2, len, rate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < rate * 0.01 ? i / (rate * 0.01) : 1);
      }
    }
    return b;
  }

  const pending = {};
  const loaded = {};

  function urlOf(f) {
    return (window.__SAMPLES__ && window.__SAMPLES__[f]) || ("audio/" + f);
  }

  /* 单个采样：按需加载 + Promise 去重 */
  function ensure(f) {
    if (loaded[f]) return Promise.resolve(loaded[f]);
    if (pending[f]) return pending[f];
    pending[f] = fetch(urlOf(f))
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      })
      .then((ab) => new Promise((ok, no) => {
        const pr = ctx.decodeAudioData(ab, ok, no);
        if (pr && pr.then) pr.then(ok, no);
      }))
      .then((buf) => {
        loaded[f] = buf;
        delete pending[f];
        return buf;
      })
      .catch((e) => {
        delete pending[f];
        console.warn("[AE] 采样加载失败", f, e);
        return null;
      });
    return pending[f];
  }

  /* 批量加载（并发受限，避免一次打满请求） */
  function loadList(list, onProgress) {
    let done = 0;
    const total = list.length || 1;
    const results = new Array(list.length);
    let i = 0;
    const workers = [];
    const n = Math.min(4, list.length);
    for (let w = 0; w < n; w++) {
      workers.push((async () => {
        while (i < list.length) {
          const idx = i++;
          results[idx] = await ensure(list[idx]);
          done++;
          if (onProgress) onProgress(done / total);
        }
      })());
    }
    return Promise.all(workers).then(() => results);
  }

  /* 启动：只加载「核心鼓组」，其余后台慢慢来 */
  const CORE = ["kick1.wav", "snare1.wav", "clap1.wav", "hatc1.wav", "hato1.wav"];

  async function load(onProgress) {
    init();
    const all = Object.keys(FILES).map((k) => FILES[k])
      .concat(PIANO_KEYS.map((m) => "piano/p" + m + ".mp3"));
    const core = CORE.filter((f) => all.indexOf(f) >= 0);
    await loadList(core, (p) => onProgress && onProgress(p * 0.45));
    ready = true;
    listeners.forEach((fn) => fn());
    // 核心鼓组好了就返回，其余后台继续（不阻塞首屏）
    const rest = all.filter((f) => core.indexOf(f) < 0);
    setTimeout(() => {
      loadList(rest, (p) => onProgress && onProgress(0.45 + p * 0.55));
    }, 120);
  }

  function warm(list) { list.forEach((f) => ensure(f)); }

  function unlock() {
    init();
    if (ctx.state === "suspended") ctx.resume();
  }

  /* ---------------- 基础播放 ---------------- */

  function drum(name, when, vel, rate) {
    const f = FILES[name] || name;
    const b = loaded[f];
    if (!b) { ensure(f); return; }
    const src = ctx.createBufferSource();
    src.buffer = b;
    if (rate) src.playbackRate.value = rate;
    const g = ctx.createGain();
    g.gain.value = vel == null ? 0.95 : vel;
    const p = ctx.createStereoPanner();
    p.pan.value = name.startsWith("hat") ? 0.12 : (name.startsWith("perc") ? -0.18 : 0);
    src.connect(g); g.connect(p);
    p.connect(dryBus);
    // 鼓组也吃一点房间声
    const s = ctx.createGain(); s.gain.value = 0.07;
    p.connect(s); s.connect(revIn);
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    src.start(at);
  }

  function piano(midi, when, vel, dur) {
    let key = null;
    for (let i = 0; i < PIANO_KEYS.length; i++) {
      if (PIANO_KEYS[i] <= midi) key = PIANO_KEYS[i];
      if (PIANO_KEYS[i] >= midi) break;
    }
    if (key == null) key = PIANO_KEYS[0];
    const f = "piano/p" + key + ".mp3";
    const b = loaded[f];
    if (!b) { ensure(f); return; }
    const rate = Math.pow(2, (midi - key) / 12);
    const src = ctx.createBufferSource();
    src.buffer = b;
    src.playbackRate.value = rate;
    const g = ctx.createGain();
    const at = Math.max(when || ctx.currentTime, ctx.currentTime + 0.002);
    const v = clamp(vel == null ? 0.8 : vel, 0.02, 1.2);
    const hold = Math.max(0.12, (dur || 1.2));
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.002, v), at + 0.006);
    g.gain.setTargetAtTime(Math.max(0.002, v * 0.86), at + 0.05, 0.4);
    g.gain.setTargetAtTime(0.0001, at + hold, 0.12);
    src.connect(g);
    const p = ctx.createStereoPanner();
    p.pan.value = clamp((midi - 60) / 90, -0.35, 0.35);
    g.connect(p);
    p.connect(dryBus);
    const s = ctx.createGain(); s.gain.value = 0.3;
    p.connect(s); s.connect(revIn);
    src.start(at);
    src.stop(at + hold + 0.9);
  }

  function bass(midi, when, dur, vel) {
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const f = mtof(midi);
    const len = dur || 0.2;
    const v = clamp(vel == null ? 0.8 : vel, 0.02, 1.2);
    const out = ctx.createGain();
    out.gain.value = 0.85;
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.Q.value = 6;
    filt.frequency.setValueAtTime(220, at);
    filt.frequency.linearRampToValueAtTime(980, at + 0.015);
    filt.frequency.exponentialRampToValueAtTime(190, at + len);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(v, at + 0.008);
    env.gain.setValueAtTime(v, at + Math.max(0.03, len * 0.7));
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const o1 = ctx.createOscillator(); o1.type = "sawtooth"; o1.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f;
    const g2 = ctx.createGain(); g2.gain.value = 0.9;
    o1.connect(filt); o2.connect(g2); g2.connect(filt);
    filt.connect(env); env.connect(out); out.connect(musicBus);
    o1.start(at); o2.start(at);
    o1.stop(at + len + 0.05); o2.stop(at + len + 0.05);
  }

  function lead(midi, when, dur, vel) {
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const f = mtof(midi);
    const len = dur || 0.14;
    const v = clamp(vel == null ? 0.4 : vel, 0.02, 1);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(v, at + 0.008);
    env.gain.setTargetAtTime(v * 0.6, at + 0.02, 0.12);
    env.gain.setValueAtTime(v * 0.6, at + len * 0.8);
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.Q.value = 2.2;
    filt.frequency.setValueAtTime(5200, at);
    filt.frequency.exponentialRampToValueAtTime(1600, at + len);
    for (let i = 0; i < 3; i++) {
      const o = ctx.createOscillator();
      o.type = i === 2 ? "square" : "sawtooth";
      o.frequency.value = f;
      o.detune.value = [-9, 0, 9][i];
      const g = ctx.createGain();
      g.gain.value = i === 2 ? 0.22 : 0.5;
      o.connect(g); g.connect(filt);
      o.start(at); o.stop(at + len + 0.1);
    }
    filt.connect(env);
    const p = ctx.createStereoPanner(); p.pan.value = -0.08;
    env.connect(p); p.connect(musicBus);
    const s = ctx.createGain(); s.gain.value = 0.16; p.connect(s); s.connect(revIn);
    const d = ctx.createGain(); d.gain.value = 0.26; p.connect(d); d.connect(delIn);
  }

  function pluck(midi, when, dur, vel) {
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const f = mtof(midi);
    const len = dur || 0.4;
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(clamp(vel || 0.35, 0.01, 1), at + 0.005);
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = f;
    const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = f * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    o.connect(env); o2.connect(g2); g2.connect(env);
    const p = ctx.createStereoPanner(); p.pan.value = 0.1;
    env.connect(p); p.connect(musicBus);
    const d = ctx.createGain(); d.gain.value = 0.3; p.connect(d); d.connect(delIn);
    o.start(at); o2.start(at);
    o.stop(at + len + 0.1); o2.stop(at + len + 0.1);
  }

  function pad(midis, when, dur, vel) {
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const len = dur || 2;
    const v = clamp(vel == null ? 0.18 : vel, 0.01, 0.8);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.linearRampToValueAtTime(v, at + 0.25);
    env.gain.setValueAtTime(v, at + Math.max(0.3, len * 0.75));
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 1500; filt.Q.value = 0.8;
    (midis || []).forEach((m) => {
      const f = mtof(m);
      [-7, 7].forEach((det) => {
        const o = ctx.createOscillator();
        o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det;
        const g = ctx.createGain(); g.gain.value = 0.32;
        o.connect(g); g.connect(filt);
        o.start(at); o.stop(at + len + 0.15);
      });
    });
    filt.connect(env);
    const p = ctx.createStereoPanner(); p.pan.value = 0;
    env.connect(p); p.connect(musicBus);
    const s = ctx.createGain(); s.gain.value = 0.42; p.connect(s); s.connect(revIn);
  }

  function stab(midis, when, dur, vel) {
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const len = dur || 0.18;
    const v = clamp(vel == null ? 0.14 : vel, 0.01, 0.6);
    const env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, at);
    env.gain.exponentialRampToValueAtTime(v, at + 0.005);
    env.gain.exponentialRampToValueAtTime(0.0001, at + len);
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.Q.value = 3;
    filt.frequency.setValueAtTime(4200, at);
    filt.frequency.exponentialRampToValueAtTime(900, at + len);
    (midis || []).forEach((m) => {
      const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = mtof(m);
      const g = ctx.createGain(); g.gain.value = 0.28;
      o.connect(g); g.connect(filt);
      o.start(at); o.stop(at + len + 0.05);
    });
    filt.connect(env);
    const p = ctx.createStereoPanner(); p.pan.value = 0.1;
    env.connect(p); p.connect(musicBus);
    const s = ctx.createGain(); s.gain.value = 0.2; p.connect(s); s.connect(revIn);
    const d = ctx.createGain(); d.gain.value = 0.18; p.connect(d); d.connect(delIn);
  }

  function click(when, accent) {
    if (!ctx) return;
    const at = Math.max(when || ctx.currentTime, ctx.currentTime);
    const o = ctx.createOscillator();
    o.type = "square";
    o.frequency.value = accent ? 1600 : 1050;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(accent ? 0.16 : 0.09, at + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.045);
    o.connect(g); g.connect(dryBus);
    o.start(at); o.stop(at + 0.06);
  }

  function duck(when, depth, len) {
    if (!musicBus) return;
    const at = Math.max(when, ctx.currentTime);
    const d = depth == null ? 0.45 : depth;
    const g = musicBus.gain;
    g.cancelScheduledValues(at);
    g.setValueAtTime(1, at);
    g.linearRampToValueAtTime(1 - d, at + 0.008);
    g.linearRampToValueAtTime(1, at + (len || 0.18));
  }

  /* ---------------- 走带 ---------------- */
  const Transport = {
    playing: false,
    step: 0,
    bpm: 128,
    swing: 0,
    totalSteps: 64,
    pattern: null,
    _timer: null,
    _raf: null,
    _next: 0,
    _queue: [],
    _onStep: null,
    _onBar: null,
    _onLoop: null,
    _onVisual: null,

    start(opts) {
      unlock();
      this.stop(true);
      opts = opts || {};
      this.bpm = opts.bpm || this.bpm || 128;
      this.swing = opts.swing || 0;
      this.totalSteps = opts.steps || 64;
      this._onStep = opts.onStep || null;
      this._onBar = opts.onBar || null;
      this._onLoop = opts.onLoop || null;
      this._onVisual = opts.onVisual || null;
      this.playing = true;
      this.step = 0;
      this._queue = [];
      this._next = ctx.currentTime + 0.09;
      this._timer = setInterval(() => this._tick(), 25);
      this._tick();
      this._loopVisual();
    },

    _tick() {
      const look = 0.14;
      while (this._next < ctx.currentTime + look) {
        const sd = 60 / this.bpm / 4;
        const swingOff = (this.step % 2 === 1) ? this.swing * sd * 0.5 : 0;
        const t = this._next + swingOff;
        const step = this.step;
        const bar = Math.floor(step / 16);
        if (this._onStep) this._onStep(step % 16, t, bar, step);
        this._queue.push({ step: step % 16, bar, time: t });
        this._next += sd;
        this.step++;
        if (this.step >= this.totalSteps) {
          this.step = 0;
          if (this._onLoop) this._onLoop();
        }
      }
    },

    _loopVisual() {
      const tick = () => {
        if (!this.playing) return;
        const now = ctx.currentTime;
        let cur = null;
        while (this._queue.length && this._queue[0].time <= now + 0.02) {
          cur = this._queue.shift();
        }
        if (cur && this._onVisual) this._onVisual(cur.step, cur.bar);
        this._raf = requestAnimationFrame(tick);
      };
      this._raf = requestAnimationFrame(tick);
    },

    stop(silent) {
      this.playing = false;
      if (this._timer) clearInterval(this._timer);
      if (this._raf) cancelAnimationFrame(this._raf);
      this._timer = this._raf = null;
      this._queue = [];
      if (!silent) {
        if (musicBus) musicBus.gain.cancelScheduledValues(ctx.currentTime);
        if (musicBus) musicBus.gain.setValueAtTime(1, ctx.currentTime);
      }
    }
  };

  /* ---------------- 工具 ---------------- */
  function getLevels() {
    if (!analyser) return { rms: 0, peak: 0, db: -100 };
    analyser.getFloatTimeDomainData(anData);
    let sum = 0, peak = 0;
    for (let i = 0; i < anData.length; i++) {
      const v = anData[i];
      sum += v * v;
      if (Math.abs(v) > peak) peak = Math.abs(v);
    }
    const rms = Math.sqrt(sum / anData.length);
    return { rms, peak, db: 20 * Math.log10(rms + 1e-8), peakDb: 20 * Math.log10(peak + 1e-8) };
  }

  function setVolume(v) {
    volume = clamp(v, 0, 1);
    if (master) master.gain.setTargetAtTime(muted ? 0 : volume, ctx.currentTime, 0.02);
  }
  function setMuted(m) {
    muted = m;
    setVolume(volume);
  }
  function setLimiter(on) {
    limiterOn = on;
    if (!ctx) return;
    // 关掉 limiter 时把它变成透明：阈值 0dB、压缩比 1:1
    limiter.threshold.setTargetAtTime(on ? -2 : 0, ctx.currentTime, 0.02);
    limiter.ratio.setTargetAtTime(on ? 20 : 1, ctx.currentTime, 0.02);
    limiter.release.setTargetAtTime(on ? 0.12 : 0.3, ctx.currentTime, 0.02);
  }
  function setLowCut(hz) {
    if (!musicHP) return;
    musicHP.frequency.setTargetAtTime(Math.max(20, hz || 20), ctx.currentTime, 0.05);
  }
  function setMasterDrive(db) {
    if (!driveGain) return;
    driveGain.gain.setTargetAtTime(Math.pow(10, (db || 0) / 20), ctx.currentTime, 0.04);
  }
  function getPreLevels() {
    if (!preAnalyser) return { rms: 0, peak: 0, db: -100, peakDb: -100 };
    preAnalyser.getFloatTimeDomainData(preData);
    let sum = 0, peak = 0;
    for (let i = 0; i < preData.length; i++) { const v = preData[i]; sum += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); }
    const rms = Math.sqrt(sum / preData.length);
    return { rms, peak, db: 20 * Math.log10(rms + 1e-8), peakDb: 20 * Math.log10(peak + 1e-8) };
  }
  function setDelayBeat(bpm, division) {
    if (!delNode) return;
    const t = (60 / bpm) / (division || 4) * 3;
    delNode.delayTime.setTargetAtTime(clamp(t, 0.02, 1.5), ctx.currentTime, 0.05);
  }

  function playSequence(notes, bpm, opts) {
    unlock();
    opts = opts || {};
    const beat = 60 / (bpm || 120);
    const t0 = ctx.currentTime + (opts.delay == null ? 0.12 : opts.delay);
    const times = [];
    notes.forEach((n) => {
      const at = t0 + n.beat * beat;
      times.push(at);
      const dur = (n.dur == null ? 1 : n.dur) * beat;
      piano(n.midi, at, n.vel == null ? 0.75 : n.vel, dur);
      if (opts.onNote) {
        const ms = (at - ctx.currentTime) * 1000;
        setTimeout(() => opts.onNote(n, at), Math.max(0, ms));
      }
    });
    if (opts.onEnd) {
      const end = t0 + (opts.tail || 1.2);
      setTimeout(() => opts.onEnd(), Math.max(0, (end - ctx.currentTime) * 1000));
    }
    return times;
  }

  function now() { return ctx ? ctx.currentTime : 0; }

  // 预加载
  const readyPromise = { then: (fn) => { if (ready) fn(); else listeners.push(fn); } };

  return {
    init, load, unlock, readyPromise,
    get ctx() { return ctx; },
    get ready() { return ready; },
    now, mtof,
    drum, piano, bass, lead, pluck, pad, stab, click, duck,
    playSequence, getLevels, getPreLevels, setVolume, setMuted, setLimiter, setDelayBeat, setLowCut, setMasterDrive,
    ensure, loadList, warm,
    Transport,
    get analyser() { return analyser; },
    PIANO_KEYS
  };
})();

</script>
<script>
/* ===========================================================
   FLM 学院 · 互动组件
   =========================================================== */
window.W = (function () {
  "use strict";
  const C = window.COURSE;
  const AE = window.AE;
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const running = new Set();

  /* ---------------- 段落 ---------------- */
  const SECTIONS = {
    intro: { drums: { kick: 1, hatc: 1, hato: 1 }, bass: 0, chords: "pad", lead: 0 },
    build: { drums: { kick: 1, hatc: 1, hato: 1 }, bass: 0, chords: "pad", lead: 0, riser: 1 },
    drop: { drums: { kick: 1, snare: 1, clap: 1, hatc: 1, hato: 1, perc: 1 }, bass: 1, chords: 1, lead: 1, impact: 1 },
    break: { drums: {}, bass: 0, chords: "pad", lead: "arp8" },
    outro: { drums: { kick: 1, hatc: 1 }, bass: 1, chords: "pad", lead: 0 }
  };

  function sectionAt(p, bar) {
    if (!p.arrangement || !p.arrangement.length) return null;
    const total = p.arrangement.reduce((a, s) => a + s.bars, 0) || 1;
    let b = bar % total, acc = 0;
    for (let i = 0; i < p.arrangement.length; i++) {
      const s = p.arrangement[i];
      if (b < acc + s.bars) return { sec: s, barIn: b - acc, index: i };
      acc += s.bars;
    }
    return { sec: p.arrangement[0], barIn: 0, index: 0 };
  }

  function totalBars(p) {
    if (p.arrangement && p.arrangement.length) return p.arrangement.reduce((a, s) => a + s.bars, 0);
    return p.bars || 4;
  }

  function chaosChord() {
    const keys = Object.keys(C.chords);
    return keys[Math.floor(Math.random() * keys.length)];
  }

  function scheduleStep(p, step, time, bar) {
    const arr = sectionAt(p, bar);
    const sec = arr ? SECTIONS[arr.sec.type] : null;
    const barDur = (60 / p.bpm) * 4;
    const chordId = p.chords.chaos ? chaosChord() : (p.chords.list[bar % p.chords.list.length] || "Am");
    const chord = C.chords[chordId] || C.chords.Am;
    const voice = C.voice[chordId] || chord.notes;

    // 鼓
    const gd = p.gain.drums;
    C.drumRows.forEach((row) => {
      const t = p.drums[row.id];
      if (!t || !t.on || !t.steps) return;
      if (sec && !sec.drums[row.id]) return;
      if (t.steps.indexOf(step) < 0) return;
      const human = row.id === "hatc" ? 1 + (Math.random() - 0.5) * 0.08 : 1;
      AE.drum(t.sample, time, clamp((t.gain || 0.8) * gd * human, 0, 1.2));
      if (row.id === "kick" && p.sidechain) AE.duck(time, 0.5, 0.17);
    });

    // 和弦
    const chordMode = sec ? (sec.chords || "none") : (p.chords.on ? p.chords.mode : "none");
    if (step === 0 && (chordMode === "pad")) {
      AE.pad(voice, time, barDur * 0.99, 0.2 * (p.chords.gain || 0.7) * p.gain.chords);
    }
    if (chordMode === "stab" && [2, 6, 10, 14].indexOf(step) >= 0) {
      AE.stab(voice, time, 0.16, 0.2 * (p.chords.gain || 0.7) * p.gain.chords);
    }

    // 贝斯
    const bassOn = sec ? sec.bass : p.bass.on;
    if (bassOn) {
      let note = null;
      if (p.bass.chaos) note = 33 + Math.floor(Math.random() * 14);
      else if (p.bass.mode === "root8" && step % 2 === 0) note = chord.bass;
      else if (p.bass.mode === "offbeat" && step % 2 === 1) note = chord.bass;
      else if (p.bass.mode === "rolling") note = chord.bass + (step % 2 ? 12 : 0);
      if (note != null) AE.bass(note, time, p.bass.mode === "rolling" ? 0.1 : 0.16, 0.9 * p.bass.gain * p.gain.bass);
    }

    // 主音
    const leadOn = sec ? !!sec.lead : p.lead.on;
    if (leadOn) {
      const mode = (sec && sec.lead === "arp8") ? "arp8" : p.lead.mode;
      const seq = [0, 1, 2, 1, 3, 2, 1, 2];
      const tone = voice[seq[step % seq.length] % voice.length] + 12;
      const lv = 0.35 * (p.lead.gain || 0.6) * p.gain.lead;
      if (p.lead.chaos) {
        if (step % 2 === 0) AE.lead(57 + Math.floor(Math.random() * 24), time, 0.12, lv);
      } else if (mode === "arp16") {
        AE.lead(tone, time, 0.11, lv);
      } else if (mode === "arp8" && step % 2 === 0) {
        AE.lead(tone, time, 0.2, lv);
      } else if (mode === "stab" && [2, 6, 10, 14].indexOf(step) >= 0) {
        AE.stab(voice.map((m) => m + 12), time, 0.14, lv * 0.8);
      }
    }

    // FX
    if (arr) {
      if (p.fx.riser && arr.sec.type === "build" && arr.barIn === 0 && step === 0) {
        AE.drum("riser1", time, 0.55);
      }
      if (p.fx.impact && arr.sec.type === "drop" && arr.barIn === 0 && step === 0) {
        AE.drum("impact1", time, 0.7);
      }
      if (p.fx.impact && arr.sec.type === "break" && arr.barIn === 0 && step === 0) {
        AE.drum("impact2", time, 0.35);
      }
    }
  }

  function stopAll() {
    AE.Transport.stop();
    running.forEach((fn) => { try { fn(); } catch (e) {} });
    running.clear();
  }

  /* =========================================================
     1. 跟拍
     ========================================================= */
  function mountTap(cfg, host, ctx) {
    const id = "tap" + Math.random().toString(36).slice(2);
    const threshold = cfg.threshold || 60;
    const beats = cfg.beats || 8;
    const bpm = cfg.bpm || 128;
    const beatDur = 60 / bpm;
    let times = [], taps = [], started = false, raf = null;

    host.innerHTML =
      '<div class="card">' +
      '<div class="row between mb16"><div><div class="h3">节拍跟拍</div>' +
      '<div class="tiny">' + bpm + ' BPM · ' + beats + ' 拍 · 目标 ' + threshold + ' 分</div></div>' +
      '<button class="btn primary" data-act="start">开始跟拍</button></div>' +
      '<div class="tap-pad" data-pad><div class="big">点这里</div><div class="sub">先听 4 拍，然后跟着「咚」每拍点一下</div></div>' +
      '<div class="tap-meta"><span>得分 <b data-score>--</b></span><span>命中 <b data-hits>0/' + beats + '</b></span>' +
      '<span data-msg class="tiny"></span></div>' +
      '<div class="tap-dots" data-dots>' + Array.from({ length: beats }).map(() => '<span class="tap-dot"></span>').join("") + '</div>' +
      '<div data-result class="mt12"></div>' +
      '</div>';

    const pad = $("[data-pad]", host);
    const dots = $$("[data-dots] .tap-dot", host);
    const scoreEl = $("[data-score]", host);
    const hitsEl = $("[data-hits]", host);
    const msgEl = $("[data-msg]", host);
    const resultEl = $("[data-result]", host);

    function start() {
      AE.unlock();
      stopAll();
      started = true;
      taps = [];
      dots.forEach((d) => { d.className = "tap-dot"; });
      resultEl.innerHTML = "";
      scoreEl.textContent = "--";
      hitsEl.textContent = "0/" + beats;
      msgEl.textContent = "听 4 拍…";
      const t0 = AE.now() + 0.35;
      for (let i = 0; i < 4; i++) AE.click(t0 + i * beatDur, i === 0);
      times = [];
      for (let i = 0; i < beats; i++) {
        const t = t0 + (4 + i) * beatDur;
        times.push(t);
        AE.click(t, i % 4 === 0);
      }
      raf = setInterval(() => {
        if (AE.now() > times[times.length - 1] + beatDur * 0.5) finish();
      }, 80);
      setTimeout(() => { msgEl.textContent = "现在！跟着点"; }, (t0 + 4 * beatDur - AE.now()) * 1000);
      running.add(() => { clearInterval(raf); });
    }

    function hit() {
      if (!started) { start(); return; }
      const t = AE.now();
      let best = -1, err = 9;
      times.forEach((bt, i) => {
        const e = Math.abs(t - bt);
        if (e < err && !taps.some((x) => x.i === i)) { err = e; best = i; }
      });
      if (best < 0) { pad.classList.add("hit"); setTimeout(() => pad.classList.remove("hit"), 90); return; }
      taps.push({ i: best, err });
      const d = dots[best];
      d.textContent = String(best + 1);
      d.className = "tap-dot " + (err < 0.09 ? "great" : err < 0.16 ? "good" : "bad");
      hitsEl.textContent = taps.length + "/" + beats;
      pad.classList.add("hit");
      setTimeout(() => pad.classList.remove("hit"), 90);
      if (taps.length >= beats) setTimeout(finish, 350);
    }

    function finish() {
      if (!started) return;
      started = false;
      clearInterval(raf);
      let score = 0;
      taps.forEach((x) => {
        score += x.err < 0.09 ? 100 : x.err < 0.16 ? 85 : x.err < 0.28 ? 60 : 30;
      });
      score = Math.round(score / beats);
      if (taps.length < beats) score = Math.round(score * (taps.length / beats));
      scoreEl.textContent = score;
      const okk = score >= threshold;
      resultEl.innerHTML = '<div class="result-bar ' + (okk ? "good" : score >= 50 ? "mid" : "bad") + '">' +
        (okk ? "✅ 拍感在线！" : "🎯 再来一次：先听 4 拍，身体先动，手再跟上。") +
        (okk ? " 得分 " + score + "，已记录。" : " 当前 " + score + " 分，需要 " + threshold + " 分。") + '</div>';
      msgEl.textContent = "";
      if (ctx.setTask) ctx.setTask("tap", okk);
      if (okk && ctx.toast) ctx.toast("跟拍通过 · " + score + " 分", "good");
    }

    $("[data-act=start]", host).addEventListener("click", start);
    pad.addEventListener("pointerdown", (e) => { e.preventDefault(); hit(); });

    return { destroy: () => { clearInterval(raf); } };
  }

  /* =========================================================
     2. 键盘
     ========================================================= */
  const BLACK = [1, 3, 6, 8, 10];
  const isBlack = (m) => BLACK.indexOf(((m % 12) + 12) % 12) >= 0;
  const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ";": 16, "'": 17 };

  function mountKeyboard(cfg, host, ctx) {
    const range = cfg.range || [48, 72];
    const mode = cfg.mode || "free";
    const lo = range[0], hi = range[1];
    const whites = [];
    for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
    const whiteW = 100 / whites.length;

    let html = '<div class="piano-wrap"><div class="piano-bar">';
    if (mode === "sequence" || mode === "chords" || mode === "progression" || mode === "dyn") {
      html += '<button class="btn sm primary" data-act="start">' + (mode === "sequence" ? "开始跟弹" : "开始") + '</button>';
      html += '<button class="btn sm ghost" data-act="hint">听提示</button>';
    }
    html += '<div class="sp"></div>';
    if (mode === "dyn" || mode === "free" || mode === "sequence") {
      html += '<div class="bpm-box">力度 <input type="range" min="10" max="127" value="' + (cfg.vel || 80) + '" data-vel style="width:80px"></div>';
    }
    if (mode === "pedal") html += '<button class="btn sm" data-act="pedal">🦶 延音踏板</button>';
    html += '<div class="pos-read" data-info></div></div>';
    html += '<div class="kb-scroll"><div class="kb" data-kb>';
    whites.forEach((m, i) => {
      const label = m % 12 === 0 ? C.noteName(m) : "";
      html += '<div class="key w" data-midi="' + m + '" style="width:' + whiteW + '%">' +
        '<span class="lab">' + label + '</span></div>';
    });
    for (let m = lo; m <= hi; m++) {
      if (!isBlack(m)) continue;
      let prev = m - 1, wi = 0;
      while (prev >= lo && isBlack(prev)) prev--;
      wi = whites.indexOf(prev);
      const left = (wi + 1) * whiteW - whiteW * 0.31;
      html += '<div class="key b" data-midi="' + m + '" style="left:' + left + '%">' +
        '<span class="lab">' + (isBlack(m) && m % 12 === 1 ? "" : "") + '</span></div>';
    }
    html += '</div></div>';
    html += '<div class="kb-legend"><span><i style="background:#7fdcff"></i>目标音</span>' +
      '<span><i style="background:#ffb75e"></i>你按下的音</span>' +
      '<span>电脑键盘：A W S E D F T G Y H U J K</span></div>';
    if (mode === "findC") html += '<div class="guide-banner" data-banner>提示：两个黑键左边紧挨着的白键就是 C。</div>';
    if (mode === "sequence") html += '<div class="guide-banner" data-banner>点「开始跟弹」，先听 4 拍，再按高亮的音。</div><div style="padding:0 14px 14px" data-dots class="seq-dots"></div>';
    if (mode === "chords" || mode === "progression") html += '<div class="guide-banner" data-banner></div><div style="padding:0 14px 14px" data-dots class="seq-dots"></div>';
    if (mode === "dyn") html += '<div class="guide-banner" data-banner>把力度滑杆调小弹前两个音，调大弹后两个音。</div><div style="padding:0 14px 14px" data-dots class="seq-dots"></div>';
    if (mode === "pedal") html += '<div class="guide-banner" data-banner>先踩下踏板，再弹 Am 的三个音（A-C-E）。</div>';
    html += '<div data-result style="padding:0 14px 14px"></div>';
    html += '</div>';
    host.innerHTML = html;

    const kb = $("[data-kb]", host);
    const info = $("[data-info]", host);
    const banner = $("[data-banner]", host);
    const dotsHost = $("[data-dots]", host);
    const resultEl = $("[data-result]", host);
    const velInput = $("[data-vel]", host);

    let hovered = false;
    let pedal = false;
    let vel = cfg.vel || 80;
    let state = { idx: 0, times: [], errs: [], started: false, pending: [], found: [], vels: [], done: false };

    const keyEls = {};
    $$(".key", kb).forEach((el) => { keyEls[+el.dataset.midi] = el; });

    function velNow() { return velInput ? +velInput.value : vel; }

    function flash(m, cls) {
      const el = keyEls[m];
      if (!el) return;
      el.classList.add(cls || "down");
      setTimeout(() => el.classList.remove(cls || "down"), 150);
    }

    function playNote(m, v) {
      AE.unlock();
      const dur = pedal ? 2.6 : 1.7;
      AE.piano(m, AE.now(), (v || velNow()) / 127, dur);
      flash(m);
    }

    function setInfo(txt) { if (info) info.textContent = txt; }
    function setBanner(txt) { if (banner) banner.innerHTML = txt; }

    /* --- 目标 --- */
    const chordList = cfg.chords || [];
    function chordPcs(id) { return (C.chords[id].notes || []).map((m) => m % 12); }

    function renderDots() {
      if (!dotsHost) return;
      if (mode === "sequence") {
        dotsHost.innerHTML = cfg.notes.map((m, i) =>
          '<span class="seq-dot ' + (i < state.idx ? "ok" : i === state.idx ? "now" : "") + '">' + C.noteName(m) + '</span>').join("");
      } else if (mode === "chords" || mode === "progression") {
        dotsHost.innerHTML = chordList.map((c, i) =>
          '<span class="seq-dot ' + (state.done && i < state.idx ? "ok" : i === state.idx ? "now" : "") + '">' + c + '</span>').join("");
      } else if (mode === "dyn") {
        dotsHost.innerHTML = cfg.notes.map((m, i) =>
          '<span class="seq-dot ' + (i < state.vels.length ? "ok" : i === state.vels.length ? "now" : "") + '">' +
          C.noteName(m) + '</span>').join("");
      }
    }

    function highlightTargets(list) {
      $$(".key", kb).forEach((el) => el.classList.remove("hl"));
      (list || []).forEach((m) => { if (keyEls[m]) keyEls[m].classList.add("hl"); });
    }

    /* --- 跟弹 --- */
    function startSeq() {
      AE.unlock();
      stopAll();
      state = { idx: 0, times: [], errs: [], started: true, pending: [], found: state.found || [], vels: [], done: false };
      renderDots();
      resultEl.innerHTML = "";
      const bpm = cfg.bpm || 70;
      const beat = 60 / bpm;
      const t0 = AE.now() + 0.3;
      for (let i = 0; i < 4; i++) AE.click(t0 + i * beat, i === 0);
      state.times = cfg.notes.map((n, i) => t0 + (4 + i) * beat);
      setBanner("跟节拍弹：<b>" + cfg.notes.map((m) => C.noteName(m)).join(" → ") + "</b>");
      const tick = setInterval(() => {
        const i = state.idx;
        if (i < cfg.notes.length) highlightTargets([cfg.notes[i]]);
        if (AE.now() > state.times[state.times.length - 1] + 0.9) { finishSeq(); }
      }, 100);
      running.add(() => clearInterval(tick));
    }

    function finishSeq() {
      if (!state.started) return;
      state.started = false;
      const n = cfg.notes.length;
      let total = 0;
      for (let i = 0; i < n; i++) {
        if (i >= state.errs.length) { total += 0; continue; }
        const e = state.errs[i];
        total += e < 0.12 ? 100 : e < 0.25 ? 85 : e < 0.5 ? 60 : e < 1.0 ? 30 : 15;
      }
      const score = Math.round(total / n);
      const okk = score >= 70 && state.errs.length === n;
      resultEl.innerHTML = '<div class="result-bar ' + (okk ? "good" : score >= 45 ? "mid" : "bad") + '">' +
        (okk ? "✅ 弹得不错！" : "🎯 慢一点，先看清下一个音。") + " 得分 " + score + " / 100</div>";
      if (ctx.setTask && cfg.task) ctx.setTask(cfg.task, okk);
      if (okk && ctx.toast) ctx.toast("跟弹通过 · " + score + " 分", "good");
      highlightTargets([]);
    }

    /* --- 找 C --- */
    function checkFindC(m) {
      const isC = m % 12 === 0;
      if (!isC) {
        setBanner("不是这个。找<b>两个黑键左边</b>的白键。你点的这个音是 " + C.noteName(m) + "。");
        return;
      }
      const targets = cfg.targets;
      if (targets && targets.indexOf(m) < 0) {
        setBanner("这是 " + C.noteName(m) + "，但我要的是 " + targets.map((x) => C.noteName(x)).join(" 和 ") + "。");
        return;
      }
      if (state.found.indexOf(m) >= 0) { setBanner("这个 C 已经点过啦，换一个。"); return; }
      state.found.push(m);
      const need = cfg.count || (targets ? targets.length : 3);
      setBanner("找到 " + state.found.length + " / " + need + " 个 C：" + state.found.map((x) => C.noteName(x)).join("、"));
      if (state.found.length >= need) {
        setBanner("✅ 全部找到：" + state.found.map((x) => C.noteName(x)).join("、"));
        if (ctx.setTask && cfg.task) ctx.setTask(cfg.task, true);
        if (ctx.toast) ctx.toast("找到全部 C", "good");
      }
    }

    /* --- 和弦 --- */
    function checkChord(m) {
      if (!state.started) {
        state.started = true;
        state.idx = 0;
        state.pending = [];
      }
      if (state.idx >= chordList.length) return;
      state.pending.push({ m: m, t: AE.now() });
      // 同一音重复点不算
      const now = AE.now();
      state.pending = state.pending.filter((x) => now - x.t < 2.2);
      const target = chordPcs(chordList[state.idx]);
      const uniq = [];
      state.pending.forEach((x) => { if (uniq.indexOf(x.m % 12) < 0) uniq.push(x.m % 12); });
      setInfo("已按：" + uniq.map((pc) => C.noteName(pc + 60)).join(" "));
      if (uniq.length >= target.length) {
        const same = target.length === uniq.length && target.every((pc) => uniq.indexOf(pc) >= 0);
        if (same) {
