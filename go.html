<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<title>阿香卤味 · 进店</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  background:linear-gradient(165deg,#fff7ed 0%,#ffedd5 55%,#fed7aa 100%);
  color:#1c1917;min-height:100vh;padding:26px 18px 34px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:430px}
.hero{text-align:center;margin-bottom:22px}
.emoji{font-size:50px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(234,88,12,.22))}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#7c2d12}
.slogan{font-size:13px;color:#78716c;margin-top:5px;letter-spacing:.4px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:13px;
  box-shadow:0 2px 4px rgba(28,25,23,.04),0 8px 26px rgba(28,25,23,.07)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px;
  border-radius:14px;text-decoration:none;font-size:17px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#ea580c,#c2410c);
  box-shadow:0 5px 16px rgba(234,88,12,.3);transition:.18s;margin-bottom:11px;border:0;width:100%}
.btn:active{transform:scale(.975)}
.btn.g{background:linear-gradient(135deg,#16a34a,#15803d);box-shadow:0 5px 16px rgba(22,163,74,.28)}
.btn.m{background:#fff;color:#ea580c;border:1.5px solid rgba(234,88,12,.28);box-shadow:none}
h2{font-size:14px;font-weight:700;color:#57534e;margin:0 0 9px;display:flex;align-items:center;gap:6px}
h2::before{content:"";width:3px;height:14px;border-radius:2px;background:#ea580c}
ol,ul{padding-left:19px;font-size:13.5px;color:#44403c;line-height:1.85}
ol li::marker{color:#ea580c;font-weight:700}
.status{margin-top:14px;text-align:center;font-size:12.5px;color:#78716c;line-height:1.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#a8a29e;margin-right:5px;vertical-align:middle}
.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.dot.off{background:#ef4444}
.dot.w{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.tip{font-size:11.5px;color:#a8a29e;text-align:center;margin-top:16px;line-height:1.7}
.mode{font-size:11px;text-align:center;color:#a8a29e;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="emoji">🍖</div>
    <h1>阿香卤味</h1>
    <div class="slogan">老卤现捞 · 当天现做</div>
  </div>

  <div class="card">
    <a class="btn" id="goShop" href="index.html"><span>🛒</span>进店看菜单</a>
    <a class="btn g" id="goPanel" href="shop.html"><span>📊</span>商家后台</a>
    <button class="btn m" id="recheck">🔄 检测服务状态</button>
  </div>

  <div class="card">
    <h2>怎么下单</h2>
    <ol>
      <li>进店选商品，加入购物车</li>
      <li>填姓名、电话、送哪儿</li>
      <li>提交后扫商家收款码付款</li>
      <li>钱直接付给商家，平台不代收</li>
    </ol>
  </div>

  <div class="card">
    <h2>说明</h2>
    <ul>
      <li>本店不收任何预付款</li>
      <li>市区当天送达，17:00 前下单</li>
      <li>有问题群里问，或直接联系店主</li>
      <li>无论哪个入口打开，下单都一样有效</li>
    </ul>
  </div>

  <div class="status" id="st"><span class="dot w"></span>正在检测加速服务…</div>
  <div class="mode" id="mode"></div>
  <div class="tip">本页永久有效，可放心收藏</div>
</div>

<script>
(function(){
  "use strict";
  var $=function(i){return document.getElementById(i)};

  // ===== 手机端加速节点（挂了自动跳过）=====
  var NODES=[
    "https://freeze-sometimes-exhibitions-signatures.trycloudflare.com",
    "https://ray-problems-theatre-find.trycloudflare.com"
  ];

  // ===== GitHub 兜底（永远可用）=====
  var GH = location.origin + location.pathname.replace(/go\.html$/, "");

  var picked = null;

  function probe(base, ms){
    return new Promise(function(res){
      var done=false, t=setTimeout(function(){if(!done){done=true;res(false)}},ms);
      fetch(base+"/health",{cache:"no-store",mode:"cors"})
        .then(function(r){return r.json()})
        .then(function(d){if(!done){done=true;clearTimeout(t);res(!!d.ok)}})
        .catch(function(){if(!done){done=true;clearTimeout(t);res(false)}});
    });
  }

  function useLocal(base){
    picked = base;
    $("goShop").href  = base + "/index.html";
    $("goPanel").href = base + "/panel.html";
    $("st").innerHTML = '<span class="dot on"></span>已连接加速服务，加载更快';
    $("mode").textContent = "";
  }

  function useGH(){
    picked = "gh";
    $("goShop").href  = GH + "index.html";
    $("goPanel").href = GH + "shop.html";
    $("st").innerHTML = '<span class="dot off"></span>加速服务离线，已自动切到备用线路';
    $("mode").textContent = "功能完全一致，可正常下单";
  }

  function check(){
    $("st").innerHTML = '<span class="dot w"></span>正在检测加速服务…';
    var i = 0;
    (function next(){
      if (i >= NODES.length){ useGH(); return; }
      var base = NODES[i++];
      probe(base, 5000).then(function(ok){
        if (ok) useLocal(base); else next();
      });
    })();
  }

  $("recheck").onclick = check;
  check();

  // 每 40 秒复检：一开始用 GH，若手机恢复会自动切回加速
  setInterval(function(){
    if (picked === "gh"){
      var i=0;
      (function next(){
        if (i>=NODES.length) return;
        var base=NODES[i++];
        probe(base,4000).then(function(ok){ if(ok) useLocal(base); else next(); });
      })();
    }
  }, 40000);
})();
</script>
</body>
</html>
