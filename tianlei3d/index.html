   HD-2D · 真 3D 环境版（iso3d）
   --------------------------------------------------------------------------

     · 光   = 真方向光 + ShadowMap（真阴影）+ 路灯点光
     · 建筑 = 真 3D 体块（投出真影子）
     · 道具 = 2D 立绘公告板（保留 HD-2D 招牌）+ 接地影
     · 角色 = 2D 立绘公告板（8 方向）
     · 后处理：泛光 Bloom + 移轴景深 Tilt-Shift + 调色
   相机 = 正交 + 45° 锁死，像素尺度与 2D iso 完全一致：
     +u(世界X) → (+32,+16) 像素 ／ +v(世界Z) → (-32,+16) 像素   (TW=64,TH=32)
   ========================================================================== */
const TW = TileWorld.TW, TH = TileWorld.TH, MW = TileWorld.MW, MH = TileWorld.MH;

const BUILDINGS = TileWorld.buildings;

let W = 1, H = 1, hw = 1, vh = 1, UNIT_PX = 45.26, zoomH = 1, zoomW = 0;
const CAM_DIR = new THREE.Vector3(Math.cos(Math.PI / 6) * Math.cos(Math.PI / 4), Math.sin(Math.PI / 6), Math.cos(Math.PI / 6) * Math.sin(Math.PI / 4)); // 仰角30° 方位45°
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 100, 520);
/* ★ 视角切换：正交(HD-2D 原样) ↔ 透视(3D 自由视角) —— 正交路径一行不改 */
const camP = new THREE.PerspectiveCamera(70, 1, 0.1, 900);
let CAM_MODE = 'hd2d';
// ★ 透视专用（俯视玩家）
const camPS = { yaw: 0.9, pitch: -0.32, dist: 6.0 };   // ★ 之前那个透视版本（复用）
function CAM() { return CAM_MODE === 'persp' ? camP : cam; }
const camTarget = new THREE.Vector3(36, 0, 30);
const reflCam = new THREE.OrthographicCamera(-1,1,1,-1,100,520);
let reflRT = null;
const groundMeshes = []; let waterMesh = null;
const GROUND_UNI = { uRefl:{value:null}, uRes:{value:new THREE.Vector2(1,1)}, uReflAmt:{value:0.85} };

function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  // 关键：让 1 世界单位 X = TW/2 像素（与 2D 菱形完全同尺度）
  hw = 0.7071 * W / TW / zoomH;                    // ★ zoomH 越大 = 视野越小 = 放大
  vh = hw * H / W;
  if (zoomW > 0) hw = zoomW * 0.7071 * W / TW / 1; // ★ zoomW 独立控制宽度（0=自适应）
  cam.left = -hw; cam.right = hw; cam.top = vh; cam.bottom = -vh;
  cam.updateProjectionMatrix();
  camP.aspect = W / (H || 1); camP.updateProjectionMatrix();
  reflCam.left = -hw; reflCam.right = hw; reflCam.top = vh; reflCam.bottom = -vh;
  reflCam.updateProjectionMatrix();
  const _dpr = renderer.getPixelRatio();
  if (!reflRT) reflRT = new THREE.WebGLRenderTarget(1,1,{ minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter });
  reflRT.setSize(W*_dpr, H*_dpr);
  GROUND_UNI.uRefl.value = reflRT.texture;
  GROUND_UNI.uRes.value.set(W*_dpr, H*_dpr);
  UNIT_PX = W / (2 * hw);
  if (typeof onResizeFx === 'function') onResizeFx();
}

/* ---------------- 材质 ---------------- */
const L = new THREE.TextureLoader();
const TEX_CACHE = {};
function loadTex(name, kind) {
  const key = name + '|' + kind;
  if (TEX_CACHE[key]) return TEX_CACHE[key];
  const url = kind === 'albedo' ? ('assets/tex/' + name + '.jpg')
            : ('assets/tex/' + name + '_' + (kind === 'normal' ? 'n' : 'r') + '.png');
  const t = L.load(url);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (kind === 'albedo' && THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = Math.min(ULTRA ? 16 : 8, (renderer.capabilities && renderer.capabilities.getMaxAnisotropy) ? renderer.capabilities.getMaxAnisotropy() : 8);
  TEX_CACHE[key] = t; return t;
}
function pbrMat(name, opt) {
  opt = opt || {};
  const m = new THREE.MeshStandardMaterial({
    map: loadTex(name, 'albedo'),
    normalMap: loadTex(name, 'normal'),
    roughnessMap: loadTex(name, 'rough'),
    metalness: 0.0, roughness: 0.95,
  });
  Object.assign(m, opt);
  return m;
}


/* ==========================================================
   ★ 烘焙 GI（世界坐标）—— 移动不穿帮的关键
   对每个格子，从光源出发做遮挡步进，累加带颜色的辐照度。
   结果写进一张 MW×MH 的贴图，按世界坐标采样 → 永远钉在地上。
   ========================================================== */
function bakeGI(){
  const em=[];
  for(let v=0;v<MH;v++)for(let u=0;u<MW;u++){
    const t=at(u,v);
    if(t===T.LAMP) em.push([u+.5,v+.5, 1.00,0.60,0.26, 1.0]);
    else if(t===T.FOUNTAIN) em.push([u+.5,v+.5, 0.30,0.55,0.95, 0.7]);
    else if(t===T.ALTAR) em.push([u+.5,v+.5, 0.55,0.35,1.00, 0.8]);
    else if(t===T.CAULDRON) em.push([u+.5,v+.5, 1.00,0.42,0.14, 0.8]);
  }
  const NEO=[[1.0,0.28,0.62],[0.24,0.86,1.0],[1.0,0.72,0.24],[0.52,1.0,0.46]];
  BUILDINGS.forEach((b,i)=>{ const c=NEO[i%NEO.length]; em.push([b.x-0.6, b.y+b.h/2, c[0],c[1],c[2], 1.2]); });
  const data=new Uint8Array(MW*MH*4);
  for(let v=0;v<MH;v++)for(let u=0;u<MW;u++){
    let r=0,g=0,b=0;
    for(const e of em){
      const du=e[0]-(u+0.5), dv=e[1]-(v+0.5), d=Math.hypot(du,dv);
      if(d>26) continue;
      let vis=1; const K=9;                       // 遮挡步进
      for(let k=1;k<=K;k++){ const f=k/(K+1);
        const su=u+0.5+du*f, sv=v+0.5+dv*f;
        const tx=Math.max(0,Math.min(MW-1,Math.floor(su))), ty=Math.max(0,Math.min(MH-1,Math.floor(sv)));
        if((HEIGHT[at(tx,ty)]||0)>14){ vis=0; break; } }
      const att=vis*e[5]/(1+d*d*0.09);
      r+=e[2]*att; g+=e[3]*att; b+=e[4]*att;
    }
    const i=(v*MW+u)*4;
    data[i]=Math.min(255, r*120); data[i+1]=Math.min(255, g*120); data[i+2]=Math.min(255, b*120); data[i+3]=255;
  }
  const tex=new THREE.DataTexture(data, MW, MH, THREE.RGBAFormat);
  tex.needsUpdate=true; tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  return tex;
}
const GI_TEX = bakeGI();
function injectGround(mat){
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uGI={value:GI_TEX};
    sh.uniforms.uRefl=GROUND_UNI.uRefl; sh.uniforms.uRes=GROUND_UNI.uRes; sh.uniforms.uReflAmt=GROUND_UNI.uReflAmt;
    sh.uniforms.uEnv={ value: cubeRT.texture };
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec2 vWPx;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvWPx=(modelMatrix*vec4(transformed,1.0)).xz;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\nuniform sampler2D uGI,uRefl;uniform samplerCube uEnv;uniform vec2 uRes;uniform float uReflAmt;varying vec2 vWPx;')
      .replace('#include <dithering_fragment>',[
        '#include <dithering_fragment>',
        // 烘焙 GI（世界坐标，移动不穿帮）
        '  vec3 gi=texture2D(uGI, vWPx/vec2('+MW+'.0,'+MH+'.0)).rgb;',
        '  gl_FragColor.rgb += gi*1.15;',
        // ★ 湿地面真平面反射（水洼掩膜调制，避免整体塑料感）
        // ★ 反射探针：按法线扰动取环境色 → 湿地面霓虹反射（正交下正确）
        // 湿面反光：几乎平的法线（去掉波纹），只在积水处、很弱
        '  vec3 nrm=vec3(0.02, 1.0, 0.02);',   // 极平法线，杜绝摩尔纹
        '  vec3 env=textureCube(uEnv, reflect(vec3(-0.5,-0.72,-0.5), nrm)).rgb;',
        '  float pud=smoothstep(0.55,0.85, 0.5+0.5*sin(vWPx.x*0.17)*cos(vWPx.y*0.13));',   // 大尺度、低频积水
        '  gl_FragColor.rgb += env*pud*0.28;'
      ].join('\n'));
  };
  mat.needsUpdate=true;
}

/* ---------------- 地面：真 3D 网格（世界空间 UV → 无缝） ---------------- */
function injectCharGI(root){                 // ★ 让 3D 角色也吃烘焙 GI（被霓虹染色）
  root.traverse(o=>{ if(o.isMesh && o.material){
    o.material.onBeforeCompile=(sh)=>{
      sh.uniforms.uGI={value:GI_TEX};
      sh.uniforms.uTime={value:0}; sh.uniforms.uSway={value:0};
      sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec2 vWPx;\nuniform float uTime; uniform float uSway;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\n{ float low=max(0.0,(0.95-transformed.y)); float k=low*low*0.16*(0.5+uSway); transformed.x += sin(uTime*2.6 + position.y*3.0 + position.x*2.0)*k; transformed.z += cos(uTime*2.1 + position.y*2.6)*k*0.7; float sy=clamp(transformed.y/1.86,0.0,1.0); float sc=0.88+0.26*sy; transformed.x*=sc; transformed.z*=sc; }\nvWPx=(modelMatrix*vec4(transformed,1.0)).xz;')
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nuniform sampler2D uGI;varying vec2 vWPx;')
        .replace('#include <dithering_fragment>','#include <dithering_fragment>\n  vec3 gi=texture2D(uGI, vWPx/vec2('+MW+'.0,'+MH+'.0)).rgb;\n  gl_FragColor.rgb += gi*1.7;');
      o.material.userData.sh=sh;
    };
    o.material.needsUpdate=true;
  }});
}
const REPEAT = 6;                      // 1 张贴图 = 6 格（越大越清楚）
function buildGround() {
  const groups = {};                   // name -> {pos,uv,idx,base}
  const waterCells = [];
  for (let v = 0; v < MH; v++) for (let u = 0; u < MW; u++) {
    const t = at(u, v);
    let name;
    if (t === T.WATER) { name = 'dirt'; waterCells.push([u, v]); }   // 水底铺泥，水面另画
    else {
      const gt = (TileWorld.GROUND_OF[t] !== undefined) ? TileWorld.GROUND_OF[t] : t;
      name = TileWorld.TEX2TILE[gt] || 'grass';
    }
    name='city';   // ★ 全部地面 = 王炸雨夜沥青
    let g = groups[name]; if (!g) g = groups[name] = { pos: [], uv: [], idx: [], base: 0 };
    const R = REPEAT, x0 = u, z0 = v, x1 = u + 1, z1 = v + 1;
    g.pos.push(x0, 0, z0, x1, 0, z0, x1, 0, z1, x0, 0, z1);
    g.uv.push(u / R, v / R, (u + 1) / R, v / R, (u + 1) / R, (v + 1) / R, u / R, (v + 1) / R);
    const b = g.base; g.idx.push(b, b + 1, b + 2, b, b + 2, b + 3); g.base += 4;
  }
  for (const name in groups) {
    const g = groups[name];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(g.uv, 2));
    geo.setIndex(g.idx);
    geo.computeVertexNormals();
    const mat = pbrMat(name); injectGround(mat); mat.side = THREE.DoubleSide;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.receiveShadow = true;
    scene.add(mesh); groundMeshes.push(mesh);
  }
  return waterCells;
}
const WATER_CELLS = buildGround();

/* ---------------- 水面：独立半透明高光面 ---------------- */
(function buildWater() {
  if (!WATER_CELLS.length) return;
  const pos = [], uv = [], idx = []; let base = 0;
  for (const [u, v] of WATER_CELLS) {
    pos.push(u, 0, v, u + 1, 0, v, u + 1, 0, v + 1, u, 0, v + 1);
    uv.push(u, v, u + 1, v, u + 1, v + 1, u, v + 1);
    idx.push(base, base + 1, base + 2, base, base + 2, base + 3); base += 4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({
    map: loadTex('water', 'albedo'), normalMap: loadTex('water', 'normal'),
    metalness: 0.55, roughness: 0.08, transparent: true, opacity: 0.9,
    color: 0x9fd4ff, side: THREE.DoubleSide,
  });
  const m = new THREE.Mesh(geo, mat); m.position.y = 0.06; m.receiveShadow = true; scene.add(m); waterMesh = m;
})();

/* ---------------- 精灵表（tile -> 图片 / 显示高） ---------------- */
const SPR_MAP = {
  [T.TREE]: 'tree_green', [T.SAKURA]: 'tree_sakura', [T.BUSH]: 'bush', [T.LAMP]: 'lamp',
  [T.FENCE]: 'fence', [T.CROP]: 'crop', [T.CRATE]: 'crate', [T.BARREL]: 'barrel',
  [T.ALTAR]: 'altar', [T.FOUNTAIN]: 'fountain', [T.BED]: 'desk',
  [T.STAIR_UP]: 'stairs_up', [T.STAIR_DN]: 'stairs_dn',
};
const SPR_H = { tree_green: 104, tree_sakura: 108, bush: 52, lamp2: 130, fence: 62, crop: 50,
  crate: 54, barrel: 54, altar: 64, fountain: 72, desk: 54, stairs_up: 56, stairs_dn: 56 };

const SPR_TEX = {};
function sprTex(name) { if (!SPR_TEX[name]) { const t = L.load('assets/tiles/' + name + '.png'); if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding; SPR_TEX[name] = t; } return SPR_TEX[name]; }

/* ---------------- 道具：★受光十字面片（带法线）+ 真阴影投影面 ----------------
   之前是 SpriteMaterial（不受光）→ 在 PBR 光照的场地里像"贴纸"。
   而 assets/tiles/*_n.png 法线图其实早就生成好了，只是没接上。
   现在：十字交叉的两片受光面 → 任何角度都有体积感、跟地面/墙体吃同一套光。 */
const SHADOW_YAWS = -2.15;   // 投影面朝向（大致垂直于主光）
const HAS_N = 'altar barrel bush crate crop desk fence flowerbed fountain lamp shelf stairs_dn stairs_up statue table tree_dead tree_green tree_sakura wall_stone wall_wood well'.split(' ');
const PROP_NTEX = {};
function propNrm(name) { if (!PROP_NTEX[name]) { const t = L.load('assets/tiles/' + name + '_n.png'); t.anisotropy = 4; PROP_NTEX[name] = t; } return PROP_NTEX[name]; }
function propMat(name, tex) {
  const m = new THREE.MeshStandardMaterial({ map: tex, transparent: false, alphaTest: 0.4, depthWrite: true, side: THREE.DoubleSide, roughness: 0.85, metalness: 0.0 });
  if (HAS_N.indexOf(name) >= 0) { m.normalMap = propNrm(name); m.normalScale = new THREE.Vector2(0.9, 0.9); }
  return m;
}
function addBillboard(tex, x, z, hPx, faceCam, castShadow, name) {
  const hU = hPx / UNIT_PX;
  const img = tex.image;
  const aspect = (img && img.width) ? img.width / img.height : 1;
  const wU = hU * aspect;
  const mat = propMat(name || '', tex);
  const g = new THREE.PlaneGeometry(wU, hU);
  const s = new THREE.Group();                            // ★ 十字面片
  const pa = new THREE.Mesh(g, mat); pa.position.y = hU / 2; s.add(pa);
  const pb = new THREE.Mesh(g, mat); pb.position.y = hU / 2; pb.rotation.y = Math.PI / 2; s.add(pb);
  s.position.set(x, 0, z);
  scene.add(s);
  if (castShadow) {
    // 竖直投影面（朝向固定，与公告板解耦）→ 用 alpha 抠出轮廓投真影
    const g2 = new THREE.PlaneGeometry(wU, hU);
    const mm = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.45, colorWrite: false, depthWrite: false });
    const mp = new THREE.Mesh(g2, mm);
    mp.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: tex, alphaTest: 0.45 });
    mp.castShadow = true;
    mp.position.set(x, hU / 2, z);
    mp.rotation.y = SHADOW_YAWS;
    scene.add(mp);
  }
  return s;
}

/* ==========================================================
   ★ 真 3D 模型：解码混元生成的网格 → InstancedMesh
   ========================================================== */
function decodeMesh(name){
  const b64=(window.MESHES||{})[name]; if(!b64) return null;
  const bin=atob(b64), n=bin.length, buf=new Uint8Array(n);
  for(let i=0;i<n;i++) buf[i]=bin.charCodeAt(i);
  const dv=new DataView(buf.buffer);
  if(dv.getUint32(0,false)!==0x54334431){ console.warn('mesh magic bad',name); return null; }
  const nv=dv.getUint32(4,true), nf=dv.getUint32(8,true);
  let o=12;
  const pos=new Float32Array(buf.buffer,o,nv*3); o+=nv*12;
  const nrm=new Float32Array(buf.buffer,o,nv*3); o+=nv*12;
  const uv =new Float32Array(buf.buffer,o,nv*2); o+=nv*8;
  const idx=new Uint32Array(buf.buffer,o,nf*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  g.computeBoundingSphere();
  return g;
}
function placeTrees(){
  const layers=[ {t:T.TREE, name:'tree_green', h:4.6}, {t:T.SAKURA, name:'tree_sakura', h:4.8} ];
  let total=0;
  for(const ly of layers){
    const geo=decodeMesh(ly.name); if(!geo){ console.warn('缺少网格',ly.name); continue; }
    const t2=L.load('assets3d/'+ly.name+'_tex.jpg'); if(THREE.sRGBEncoding) t2.encoding=THREE.sRGBEncoding;
    t2.anisotropy=4;
    // ★ 补法线 + 粗糙度：树之前只有 map → 塑料平光；现在吃同一套 PBR 光照
    const nrm=L.load('assets3d/'+ly.name+'_n.png'); nrm.anisotropy=4;
    const rgh=L.load('assets3d/'+ly.name+'_r.png'); rgh.anisotropy=4;
    const mat=new THREE.MeshStandardMaterial({ map:t2, normalMap:nrm, normalScale:new THREE.Vector2(1.15,1.15), roughnessMap:rgh, roughness:0.9, metalness:0.0 });
    const cells=[];
    for(let v=0;v<MH;v++)for(let u=0;u<MW;u++) if(at(u,v)===ly.t) cells.push([u+0.5,v+0.5]);
    if(!cells.length) continue;
    const inst=new THREE.InstancedMesh(geo, mat, cells.length);
    inst.castShadow=true; inst.receiveShadow=true;
    const m=new THREE.Matrix4(), q=new THREE.Quaternion(), sc=new THREE.Vector3(ly.h,ly.h,ly.h), pv=new THREE.Vector3();
    cells.forEach((c,i)=>{ pv.set(c[0],0,c[1]); m.compose(pv,q,sc); inst.setMatrixAt(i,m); });
    inst.instanceMatrix.needsUpdate=true;
    scene.add(inst); total+=cells.length;
  }
  window.__realTrees=total; return total;
}

function buildProps() {
  let n = 0;
  for (let v = 0; v < MH; v++) for (let u = 0; u < MW; u++) {
    const t = at(u, v);
    if (t === T.WALL_S || t === T.WALL_W) continue;
    if (t === T.TREE || t === T.SAKURA) continue;          // ★ 树改由真 3D 网格处理
    if (!HEIGHT[t]) continue;

let last = performance.now(), frames = 0, lastF = last, fps = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  let mx = 0, my = 0;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (jo.on) { mx = jo.x; my = jo.y; }
  // ★ 模拟量移动：轻推慢走、重推快跑、松手有惯性（可微调）
  let inX = mx, inY = my;
  const mag = Math.min(1, Math.hypot(inX, inY));
  if (mag > 0.02) {
    inX /= Math.max(Math.hypot(inX, inY), 1e-4); inY /= Math.max(Math.hypot(inX, inY), 1e-4);
  } else { inX = inY = 0; }
  // 目标速度：幅度 0~1 平方 → 低推极慢（微调），满推 = hero.speed
  const curve = mag * mag;
  const tvx = inX * hero.speed * curve, tvy = inY * hero.speed * curve;
  const accel = (mag > 0.02 ? 9.0 : 14.0) * dt;      // 手上有输入加速，松手快速收
  hero.vx += (tvx - hero.vx) * Math.min(1, accel);
  hero.vy += (tvy - hero.vy) * Math.min(1, accel);
  const sp = Math.hypot(hero.vx, hero.vy);
  if (sp > 0.02) {
    // ★ 统一旋转式：_a = 相机水平朝向（正交=45°原样；透视=camPS.yaw+180°，与 camDir 定义对齐）
    const _a = (CAM_MODE === 'persp') ? (camPS.yaw + Math.PI) : (Math.PI / 4);
    const _ca = Math.cos(_a), _sa = Math.sin(_a);
    const wx = hero.vx * _ca + hero.vy * _sa, wz = -hero.vx * _sa + hero.vy * _ca;   // ★ 前进→相机朝前，右移→相机右
    tryMove(hero.x + wx * dt, hero.y + wz * dt);
    if (CAM_MODE === 'persp') {
      // ★ 透视：按「移动方向 vs 相机朝向」选立绘（远离相机=背面/后脑勺，朝向相机=正面）
      const moveAng = Math.atan2(wx, wz) * 180 / Math.PI;
      const rel = moveAng - (camPS.yaw + Math.PI) * 180 / Math.PI;   // ★ 与移动同一基准(+π)，否则朝向差 180°
      hero.dir = dirFromAngle(((180 - rel) % 360 + 360) % 360);
    } else {
      const scrAng = Math.atan2(hero.vy, hero.vx) * 180 / Math.PI;
      hero.dir = dirFromAngle(90 - scrAng);      // 正交：原样（一模一样）
    }
    hero.t += dt * (0.4 + 1.2 * Math.min(1, sp / hero.speed));
  }
  if (CH[hero.dir] && heroUni.uMap.value !== CH[hero.dir]) { heroUni.uMap.value = CH[hero.dir]; }
  const bob = sp > 0.12 ? Math.abs(Math.sin(hero.t * 9)) * 3.0 : 0;                 // 走动起伏
  const breathe = Math.sin(now/1000 * 2.2) * 0.018;                                  // 待机呼吸
  heroMesh.position.set(hero.x, (bob/UNIT_PX), hero.y);
  if (charReady && charRoot) {
    charRoot.position.set(hero.x, 0, hero.y);
    const sp = Math.hypot(hero.vx, hero.vy);
    const moving = sp > 0.15;
    if (moving) {
      const wx2=(hero.vx*0.7071+hero.vy*0.7071), wz2=(-hero.vx*0.7071+hero.vy*0.7071);
      charRoot.rotation.y = Math.atan2(wx2, wz2) + CHAR_YAW0;
      charPhase += dt*9.0;
    } else { charPhase += dt*1.6; }
    const R=(n,x)=>{ const b=BONES[n]; if(b) b.rotation.x = b.userData.rest.x + x; };
    // 基础姿态：把举起的手臂放下（试 z 轴，两侧反向）
    if (BONES.LeftArm){  BONES.LeftArm.rotation.z  = BONES.LeftArm.userData.rest.z  + 1.15; }
    if (BONES.RightArm){ BONES.RightArm.rotation.z = BONES.RightArm.userData.rest.z - 1.15; }
    if (BONES.LeftForeArm){  BONES.LeftForeArm.rotation.z  = BONES.LeftForeArm.userData.rest.z  + 0.15; }
    if (BONES.RightForeArm){ BONES.RightForeArm.rotation.z = BONES.RightForeArm.userData.rest.z - 0.15; }
    if (moving) {
      const sw=Math.sin(charPhase);
      R('LeftUpLeg',  sw*0.75); R('RightUpLeg', -sw*0.75);
      R('LeftLeg',  Math.max(0,-sw)*1.0); R('RightLeg', Math.max(0,sw)*1.0);
      R('LeftArm', -sw*0.55); R('RightArm', sw*0.55);
      R('Spine',  Math.sin(charPhase*2)*0.05);
      if(BONES.Hips) BONES.Hips.position.y = BONES.Hips.userData.restY + Math.abs(Math.sin(charPhase))*0.03;
    } else {
      const br=Math.sin(charPhase)*0.04;
      R('Spine', br*0.6); R('LeftArm', br*0.5); R('RightArm', br*0.5);
      R('LeftUpLeg',0); R('RightUpLeg',0); R('LeftLeg',0); R('RightLeg',0);
    }
  }
  heroMesh.scale.set(1, 1 + breathe + (sp>0.12?0.02:0), 1);                          // 脚底为锚点
  if (!window.__heroContact) window.__heroContact = addContact(hero.x, hero.y, HERO_H*0.62, 0.5);
  window.__heroContact.position.set(hero.x, 0.03, hero.y);
  window.__heroContact.scale.setScalar(sp>0.12 ? 1.02 : 1.0);

  // 相机跟随（正交 + 45°）
  camTarget.lerp(new THREE.Vector3(hero.x, 0, hero.y), Math.min(1, dt * 7));
  cam.position.copy(camTarget).addScaledVector(CAM_DIR, 260);
  cam.lookAt(camTarget);   // ★ 正交：octo 原样（固定 45°）
  if (CAM_MODE === 'persp') {                       // ★ 透视：自由视角
    const cp = Math.cos(camPS.pitch), sp2 = Math.sin(camPS.pitch);
    const fx = Math.sin(camPS.yaw) * cp, fy = sp2, fz = Math.cos(camPS.yaw) * cp;
    camP.position.set(hero.x - fx * camPS.dist, 1.5 - fy * camPS.dist, hero.y - fz * camPS.dist);
    camP.lookAt(hero.x, 1.5, hero.y);
    heroMesh.quaternion.copy(camP.quaternion);
  } else {
    heroMesh.quaternion.copy(HERO_Q0);              // ★ 正交：octo 原样
  }
  // ★ 太阳固定在世界，不跟随玩家 → 影子锁定世界

  // ★ 反射探针：低频更新（跟主角）
  if (Math.floor(now/250) !== window.__cubeT) {
    window.__cubeT = Math.floor(now/250);
    cubeCam.position.set(Math.round(hero.x), 3.0, Math.round(hero.y));
    cubeCam.update(renderer, scene);
  }
  // ★ 湿地面平面反射 pass（已停用）
  if (false && reflRT) {
    reflCam.position.set(cam.position.x, -cam.position.y, cam.position.z);
    reflCam.up.set(0, -1, 0);
    reflCam.lookAt(camTarget.x, -camTarget.y, camTarget.z);
    const _saved = [];
    for (const g of groundMeshes) { _saved.push([g, g.visible]); g.visible = false; }
    if (waterMesh) { _saved.push([waterMesh, waterMesh.visible]); waterMesh.visible = false; }
    renderer.setRenderTarget(reflRT); renderer.clear(); renderer.render(scene, reflCam);
    for (const [o, v] of _saved) o.visible = v;
  }
  if (fxOn.v) {
    renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, CAM());
    mBright.uniforms.tDiffuse.value = rtScene.texture;
    renderer.setRenderTarget(rtBright); blit(mBright);
    mBlurX.uniforms.tDiffuse.value = rtBright.texture; renderer.setRenderTarget(rtBlur); blit(mBlurX);
    mBlurY.uniforms.tDiffuse.value = rtBlur.texture; renderer.setRenderTarget(rtBright); blit(mBlurY);
    mComp.uniforms.tScene.value = rtScene.texture; mComp.uniforms.tBloom.value = rtBright.texture;
    if (mComp.uniforms.uHaze) mComp.uniforms.uHaze.value = (window.__fogOn ? 1 : 0);
    renderer.setRenderTarget(null); blit(mComp);
  } else {
    renderer.setRenderTarget(null); renderer.render(scene, CAM());
  }

  frames++; if (now - lastF > 1000) {
    fps = frames * 1000 / (now - lastF); frames = 0; lastF = now;
    perf.textContent = W + 'x' + H + '  ' + fps.toFixed(0) + ' fps\n真3D地面 · ShadowMap · PBR · Bloom · TiltShift';
  }
  if (window.Shooter && window.Shooter.tick) { try { window.Shooter.tick(dt); } catch (e) { window.__stErr = String((e && e.message) || e); } }
  if (window.__CITY3D && window.__CITY3D.update) { try { window.__CITY3D.update(dt, cam.position); } catch (e) { window.__cityUpdErr = String((e && e.message) || e); } }
  requestAnimationFrame(loop);
}

(function () {                                       // 透视模式：拖动转视角（正交模式不响应）
  let drag = false, lx = 0, ly = 0;
  cv.addEventListener('pointerdown', function (e) { if (CAM_MODE !== 'persp') return; drag = true; lx = e.clientX; ly = e.clientY; });

  camPS: camPS,
  camPS: camPS,
  look: function (dyaw, dpitch) { camPS.yaw -= dyaw; camPS.pitch = Math.max(-1.25, Math.min(-0.06, camPS.pitch + dpitch)); },   // ★ 只允许俯视（不钻地）
  getFx: function () { return fxOn.v; },
  setFx: function (v) { fxOn.v = !!v; },
  getFog: function () { return !!window.__fogOn; },
  setFog: function (v) { window.__fogOn = !!v; if (window.__fogOn && !fxOn.v) fxOn.v = true; },
  zoomH: 1, zoomW: 0,

};
