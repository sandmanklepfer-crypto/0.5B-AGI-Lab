name: bake-status

# ============================================================================
#  PulseOS 定时烤页
#  ---------------------------------------------------------------------------
#  只跑 4 个脚本，分工明确：
#
#    bake.js        → run.html      需要 MQTT 实时数据（访客/执行端）
#    bake_all.js    → 6 组页面      所有状态演进都由 PulseOS 微内核算
#    bake_steps.js  → steps/        5 阶真算（python）
#    bake_clock.js  → clock.html    SVG 钟表（python 只提供当前时间）
#
#  ★ 分工铁律
#      python   只算 PulseScript 表达不出的值，且只算一次
#      PulseOS  算所有状态演进（序号/prev/环形/归档/因果分类）
#      bake     只渲染
#
#  ★ 旧脚本已弃用（bake_answers/bake_toolapi/bake_chain/bake_pool/
#    bake_evolve/bake_entry/bake_directive/bake_via_os）
#    它们各自 execFileSync('python3')，绕过 PulseOS。
#    被 bake_all.js 全面替代。
# ============================================================================

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-status
  cancel-in-progress: false

env:
  PULSE_CHAN: live7k
  PULSE_BROKER: wss://broker.hivemq.com:8884/mqtt

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 python
        run: python3 --version

      # ① 实时状态（需要 MQTT）
      - name: 烤实时状态（run.html）
        working-directory: pulseos
        run: node bake.js --chan live7k --out run.html --wait 8000
        continue-on-error: true

      # ② ★ 主力：6 组页面全走 PulseOS
      #    answers / toolapi / directive / chain / pool / evolve / entry
      - name: 全站烤页（走 PulseOS）
        working-directory: pulseos
        run: node bake_all.js . _state/all
        continue-on-error: true

      # ③ 阶梯协议（5 阶真算）
      - name: 烤阶梯（steps/）
        working-directory: pulseos
        run: node bake_steps.js steps
        continue-on-error: true

      # ④ SVG 钟表快照
      - name: 烤钟表（clock.html）
        working-directory: pulseos
        run: node bake_clock.js clock.html
        continue-on-error: true

      - name: 提交
        run: |
          git config user.name  "bake-bot"
          git config user.email "bake@users.noreply.github.com"
          git add pulseos/run.html pulseos/answers.html pulseos/toolapi.html \
                  pulseos/directive.html pulseos/entry.html pulseos/chain \
                  pulseos/pool pulseos/evolve pulseos/steps pulseos/clock.html \
                  pulseos/_state 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，跳过"
          else
            git commit -m "bake: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 北京时间"
            git push
          fi
