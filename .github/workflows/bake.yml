name: bake-status

# ============================================================================
#  每 15 分钟把 PulseOS 的实时状态「烤」成纯静态 HTML
#  ---------------------------------------------------------------------------
#  为什么需要这个：
#    抓取器和多数 AI 不执行 JS。demo.html 里的内容全靠 JS 渲染，
#    它们只能读到 "正在连接… 访客 0"。
#
#  bake.js 做的事：
#    连 MQTT → 订阅 retained 消息（访客足迹 + worker 心跳）
#    → 把真实数据写死进 run.html → 提交
#
#  然后 run.html 就是一个「有任何 AI 都能读懂」的静态页。
#
#  ★ 为什么在 Actions 里跑没问题：
#    访问的是 retained 消息（broker 永久保存的），不需要 worker 在线。
#    单次运行约 20 秒，远低于 6 小时上限。
# ============================================================================

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-status
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 烤数据（实时状态 → run.html）
        working-directory: pulseos
        run: node bake.js --chan live7k --out run.html --wait 8000

      # ★ 阶梯协议：Python 真算 5 阶，各自烧成独立静态页
      #   解决「静态托管无法按 query 返回不同内容」的问题
      - name: 烤阶梯（steps/step-N.html）
        working-directory: pulseos
        run: node bake_steps.js steps
        continue-on-error: true

      # 静态 SVG 钟表：指针角度在 bake 时算好，视觉模型截图能读出时间
      - name: 烤钟表（clock.html）
        working-directory: pulseos
        run: node bake_clock.js clock.html
        continue-on-error: true

      # 哈希链：每 15 分钟追加一条，上限 40 页（超出归档，防仓库爆炸）
      # 每条 hash = sha256(prev_hash | seq | at | fact) —— 篡改可检测
      - name: 追加哈希链（chain/）
        working-directory: pulseos
        run: node bake_chain.js chain
        continue-on-error: true

      # 状态池：10 格恒定，内容循环覆盖 —— 仓库大小永不增长
      # 对比哈希链：链会增长（已限 40 页），池永远 12 个文件
      - name: 写入状态池（pool/）
        working-directory: pulseos
        run: node bake_pool.js pool
        continue-on-error: true

      # 答案表：AI 算不出/常算错的确定性数据（时间戳/SHA-256/大数/常数）
      - name: 烤答案表（answers.html）
        working-directory: pulseos
        run: node bake_answers.js answers.html
        continue-on-error: true

      # 演化链：每步吃上一步输出，必须走完全程（不是陈列柜）
      - name: 演化链（evolve/）
        working-directory: pulseos
        run: node bake_evolve.js evolve
        continue-on-error: true

      # 强制指令页：DO NOT 列表 + STEP 清单 + 输出模板
      # 用来压住 AI「先评论后干活」的惯性
      - name: 强制指令页（directive.html）
        working-directory: pulseos
        run: node bake_directive.js directive.html
        continue-on-error: true

      # 伪装成工具 API 响应（<system-tool-instruction> 真标签）
      - name: 工具 API 页（toolapi.html）
        working-directory: pulseos
        run: node bake_toolapi.js toolapi.html
        continue-on-error: true

      # ★ 真跑 PulseOS：事实注入微内核 → emit 触发因果 → 状态落盘 → 再渲染
      #   和上面几个 bake_*.js（直接调 python）本质不同
      - name: PulseOS 实跑页（os.html）
        working-directory: pulseos
        run: node bake_via_os.js os.html
        continue-on-error: true

      - name: 提交
        run: |
          git config user.name  "bake-bot"
          git config user.email "bake@users.noreply.github.com"
          git add pulseos/run.html pulseos/steps pulseos/clock.html pulseos/chain pulseos/pool pulseos/answers.html pulseos/evolve pulseos/directive.html pulseos/toolapi.html pulseos/os.html pulseos/_state
          if git diff --cached --quiet; then
            echo "无变化，跳过"
          else
            git commit -m "bake: $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 状态快照"
            git push
          fi
