name: Deploy shop to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 自动开启 GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 准备网站文件
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      - name: 打包
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
